<!DOCTYPE html>
<html lang="en">
<!--
======================================================================
DiffClew: a git client in the browser. Backend: diffclew.py (POST /api/<name> with JSON, see its docstring).
Rules:
1. Layers, in the order they appear in the script:
     UI      - generic widgets; knows nothing about the app. Parts marked SHARED stay app-independent.
     Git     - pure functions: graph lanes, diff parsing, ref labels, folder trees. No DOM, no network; tested on startup.
     Views   - app-specific components (commit table, file list, diff, commit details, commit box, command log);
               same contract as UI: state comes in through show() / update(), events go out through callbacks.
     Api     - server calls; any failure comes back as a UserError with the server's message.
     App     - settings + state (plain data) and the commands: the only code that changes them.
     App.ui  - init() builds the shell once; after that only refresh() touches it.
2. Components return { node, ...methods }; DOM only through UI.createNode (no innerHTML); refreshed rows through UI.keyed.
3. Every change of App.state / App.settings is an App.commands entry run by App.run(id, ...args); menus, shortcuts and
   the toolbar are derived from the same table.
4. One-way data flow: App.run -> command changes the state -> one refresh per frame -> App.ui.refresh().
5. Async: App.run refreshes once the command starts (busy flags show at once) and again when it ends. App.request()
   drops an answer when a newer request of the same slot started (fast clicking), and refreshes when data arrives.
   Write actions go through App.git(): busy indicator, Command log entry, window with git's output on failure, reload.
6. UserError = expected failure (toast). Anything else is a bug for the global error handler.
7. Vanilla JS/HTML/CSS, zero dependencies, dark + light themes through the CSS variables.
======================================================================
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiffClew</title>
<style>
:root {
  --bg:#1e1e1e; --panel:#252526; --panel2:#2d2d30; --text:#d4d4d4; --dim:#8a8a8a; --border:#3c3c3c;
  --accent:#007acc; --hover:#094771; --success:#388e3c; --danger:#f14c4c; --link:#4da3ff; --row-hover:rgba(255,255,255,.045);
  --add-bg:rgba(46,160,67,.17); --del-bg:rgba(248,81,73,.17); --add-num:rgba(46,160,67,.28); --del-num:rgba(248,81,73,.28);
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; color-scheme:dark;
}
:root[data-theme="light"] {
  --bg:#ffffff; --panel:#f3f3f3; --panel2:#e8e8e8; --text:#1f1f1f; --dim:#777; --border:#d0d0d0;
  --accent:#0066b8; --hover:#cce4f7; --success:#2e7d32; --danger:#d32f2f; --link:#0b62c4; --row-hover:rgba(0,0,0,.04);
  --add-bg:rgba(46,160,67,.13); --del-bg:rgba(220,40,40,.11); --add-num:rgba(46,160,67,.22); --del-num:rgba(220,40,40,.2); color-scheme:light;
}
* { box-sizing:border-box; }
[hidden] { display:none !important; }
html, body { height:100%; }
body { margin:0; display:flex; flex-direction:column; overflow:hidden; background:var(--bg); color:var(--text); font:13px -apple-system, "Segoe UI", sans-serif; }
body.error-flash::after { content:''; position:fixed; inset:0; z-index:9999; background:var(--danger); opacity:.6; pointer-events:none; }

/* Menu bar and popup menus */
.menubar { flex:none; display:flex; align-items:center; padding:0 4px; background:var(--panel2); border-bottom:1px solid var(--border); user-select:none; }
.menubar-item { padding:6px 10px; border-radius:4px; cursor:default; }
.menubar-item:hover, .menubar-item.open { background:var(--hover); }
.menubar-info { margin-left:auto; padding:0 10px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; user-select:text; cursor:text; }
.menu { position:fixed; z-index:3000; min-width:230px; padding:4px; background:var(--panel2); border:1px solid var(--border); border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.45); user-select:none; }
.menu-item { display:flex; align-items:center; padding:5px 10px 5px 4px; border-radius:4px; cursor:default; white-space:nowrap; }
.menu-item:hover { background:var(--hover); }
.menu-item.disabled { color:var(--dim); pointer-events:none; }
.menu-check { width:20px; text-align:center; }
.menu-title { flex:1; }
.menu-key { margin-left:28px; color:var(--dim); font-size:12px; }
.menu hr { border:0; border-top:1px solid var(--border); margin:4px 0; }

/* Tabs */
.tabs { flex:none; display:flex; align-items:flex-end; padding:4px 4px 0; background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; user-select:none; }
.tab { flex:none; display:flex; align-items:center; gap:6px; max-width:240px; padding:5px 6px 5px 12px; border:1px solid transparent; border-bottom:0; border-radius:6px 6px 0 0; color:var(--dim); cursor:default; }
.tab:hover { color:var(--text); }
.tab.active { background:var(--bg); border-color:var(--border); color:var(--text); margin-bottom:-1px; padding-bottom:6px; }
.tab-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tab-close, .tab-add { all:unset; flex:none; width:18px; height:18px; line-height:18px; text-align:center; border-radius:4px; color:var(--dim); cursor:pointer; }
.tab-close:hover, .tab-add:hover { background:var(--hover); color:var(--text); }
.tab-add { margin:0 0 5px 6px; font-size:16px; }
.view-tabs { padding:4px 6px 0; background:var(--bg); }
.view-tabs .tab { padding:4px 14px; }
.view-tabs .tab.active { padding-bottom:5px; background:var(--panel); }      /* one surface with the bar below it */
.view-tab-count { min-width:16px; padding:0 5px; border-radius:8px; background:var(--accent); color:#fff; font-size:11px; line-height:16px; text-align:center; }
.dot { flex:none; width:10px; height:10px; border-radius:3px; }

/* Toolbar */
.toolbar { flex:none; display:flex; align-items:stretch; gap:2px; padding:4px 8px; background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; user-select:none; }
.tool { all:unset; position:relative; flex:none; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:50px; padding:3px 6px; border-radius:6px; font-size:11px; color:var(--text); cursor:pointer; }
.tool:hover { background:var(--hover); }
.tool:disabled { opacity:.35; cursor:default; background:none; }
.tool-badge { position:absolute; top:0; right:4px; min-width:16px; padding:0 4px; border-radius:8px; background:var(--danger); color:#fff; font-size:10px; font-weight:600; line-height:16px; text-align:center; }
.toolbar-sep { flex:none; width:1px; margin:6px 6px; background:var(--border); }
.toolbar-spacer { flex:1; }

/* Layout: main area, views, split panes */
.main { flex:1; display:flex; min-height:0; }
.content { flex:1; min-width:0; display:flex; flex-direction:column; }
.view { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
.split { flex:1; display:flex; min-width:0; min-height:0; }
.split.y { flex-direction:column; }
.split > .pane { display:flex; flex-direction:column; min-width:0; min-height:0; overflow:hidden; }
.split > .pane.flex { flex:1; }
.split-handle { flex:none; position:relative; z-index:1; background:var(--border); }
.split.x > .split-handle { width:1px; cursor:col-resize; }
.split.y > .split-handle { height:1px; cursor:row-resize; }
.split.x > .split-handle::after { content:''; position:absolute; inset:0 -3px; }
.split.y > .split-handle::after { content:''; position:absolute; inset:-3px 0; }
.split-handle:hover, .split-handle.drag { background:var(--accent); }
.stack { flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; }
.welcome { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:20px; color:var(--dim); font-size:15px; text-align:center; line-height:1.6; }
.empty-hint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; color:var(--dim); text-align:center; line-height:1.8; font-size:14px; }

/* Side panel */
.side { flex:none; position:relative; display:flex; background:var(--panel); border-left:1px solid var(--border); }
.side.left { border-left:0; border-right:1px solid var(--border); }
.side-resizer { position:absolute; z-index:1; left:-3px; top:0; bottom:0; width:6px; cursor:col-resize; }
.side.left .side-resizer { left:auto; right:-3px; }
.side-resizer:hover { background:var(--accent); opacity:.5; }
.side-sections { flex:1; min-width:0; display:flex; flex-direction:column; gap:14px; padding:8px; overflow:auto; }
.section { flex:none; font-size:12px; }
.section h4 { display:flex; align-items:center; gap:6px; margin:0 0 6px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); cursor:pointer; user-select:none; }
.section-title { flex:1; }
.section-title::before { content:'▾'; display:inline-block; width:14px; }
.section h4:hover .section-title { color:var(--text); }
.section-actions { display:flex; align-items:center; gap:4px; }
.section.collapsed h4 { margin-bottom:0; }
.section.collapsed .section-title::before { content:'▸'; }
.section.collapsed > :not(h4), .section.collapsed .section-actions { display:none; }

/* Drag to reorder (tabs, sections) */
.drag-ghost { opacity:.4; outline:1px dashed var(--dim); outline-offset:-1px; }
.drag-clone { position:fixed; z-index:4000; margin:0; pointer-events:none; background:var(--panel2); color:var(--text); border:1px solid var(--accent) !important; border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,.45); }
.section.drag-clone { box-sizing:content-box; padding:6px 8px; margin:-7px -9px; }
.section.drag-clone > :not(h4) { display:none; }
.section.drag-clone h4 { margin:0; }
.drop-marker { position:fixed; z-index:4001; border-radius:2px; background:var(--accent); pointer-events:none; }
.drop-marker.x { width:3px; margin-left:-1.5px; }
.drop-marker.y { height:3px; margin-top:-1.5px; }

/* Lists, trees and read-outs */
.list { max-height:230px; overflow:auto; }
.list-item { display:flex; align-items:center; gap:6px; padding:3px 4px; border-radius:4px; cursor:pointer; white-space:nowrap; }
.list-item:hover { background:var(--hover); }
.list-title { flex:1; overflow:hidden; text-overflow:ellipsis; }
.list-detail { color:var(--dim); font-family:var(--mono); }
.hint { color:var(--dim); line-height:1.5; }
.hint.pad { padding:8px 10px; }
.readouts { width:100%; border-collapse:collapse; }
.readouts td { padding:3px 4px; border-bottom:1px solid var(--border); }
.readouts td:first-child { color:var(--dim); white-space:nowrap; }
.readouts td:last-child { font-family:var(--mono); text-align:right; font-variant-numeric:tabular-nums; }
.tree-row { display:flex; align-items:center; gap:4px; height:22px; padding:0 4px 0 calc(2px + var(--depth, 0) * 14px); border-radius:4px; font-size:13px; white-space:nowrap; cursor:default; user-select:none; }
.tree-row:hover { background:var(--row-hover); }
.tree-row.selected { background:var(--hover); }
.tree-arrow { flex:none; width:12px; color:var(--dim); text-align:center; font-size:11px; }
.tree-title { flex:1; overflow:hidden; text-overflow:ellipsis; }
.tree-row.folder .tree-title { color:var(--dim); }
.tree-row.bold .tree-title { font-weight:700; }
.tree-badge { flex:none; padding:0 6px; border-radius:8px; background:var(--panel2); color:var(--dim); font:11px/16px var(--mono); }
.tree-badge:empty { display:none; }

/* Form controls */
.button { padding:6px 14px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:4px; cursor:pointer; font:inherit; white-space:nowrap; }
.button:hover { border-color:var(--accent); }
.button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.button.success { background:var(--success); border-color:var(--success); color:#fff; }
.button.danger { background:var(--danger); border-color:var(--danger); color:#fff; }
.button.small { padding:2px 8px; font-size:12px; }
.button:disabled { opacity:.5; cursor:not-allowed; }
.icon-button { all:unset; flex:none; padding:0 5px; border-radius:3px; color:var(--dim); cursor:pointer; text-transform:none; letter-spacing:0; font-weight:400; }
.icon-button:hover { background:var(--panel2); color:var(--text); }
input[type=text], input[type=number], select { width:100%; min-width:0; padding:5px 8px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; font:inherit; }
:is(input[type=text], input[type=number], select):focus { outline:1px solid var(--accent); border-color:var(--accent); }
input[type=range] { flex:1; min-width:0; accent-color:var(--accent); }
input[type=checkbox] { margin:0; accent-color:var(--accent); }
.check { display:flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap; }
.slider { display:flex; align-items:center; gap:8px; }
.readout { flex:none; min-width:3ch; text-align:right; font-family:var(--mono); color:var(--dim); }
.slider input[type=number] { flex:none; width:70px; }
.form { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:8px 12px; align-items:center; min-width:380px; }
.form .field { display:contents; }
.form .field > label { color:var(--dim); white-space:nowrap; }
.form.columns { display:flex; gap:12px; }
.form.columns .field { display:flex; flex-direction:column; gap:4px; flex:1; min-width:0; }
.form-note { grid-column:1 / -1; color:var(--dim); font-size:12px; line-height:1.5; }

/* Filter and search bars */
.filterbar { flex:none; display:flex; align-items:center; gap:12px; padding:4px 8px; background:var(--panel); border-bottom:1px solid var(--border); white-space:nowrap; overflow:hidden; }
.filterbar select { width:auto; padding:2px 6px; }
.filterbar input[type=text] { width:230px; padding:3px 8px; }
.filterbar .spacer { flex:1; }
.filterbar label { color:var(--dim); }

/* Commit table */
.ctable { flex:1; display:flex; flex-direction:column; min-height:0; position:relative; outline:0; }
.crow { display:grid; grid-template-columns:var(--gw, 0px) minmax(260px, 1fr) 84px minmax(0, 210px) 150px; align-items:center; height:22px; }
.crow > span { padding:0 8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.ctable.no-graph .crow { grid-template-columns:minmax(260px, 1fr) 84px minmax(0, 210px) 150px; }
.ctable.no-graph .crow > :first-child { display:none; }
.chead { flex:none; height:24px; background:var(--panel); border-bottom:1px solid var(--border); color:var(--dim); font-size:12px; font-weight:600; user-select:none; }
.cbody { flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; position:relative; }
.cspacer { position:relative; }
.cbody .crow { position:absolute; left:0; right:0; cursor:default; user-select:none; }
.cbody .crow:hover { background:var(--row-hover); }
.cbody .crow.selected { background:var(--hover); }
.cbody .crow.current { box-shadow:inset 3px 0 var(--accent); }
.crow canvas { display:block; }
.crow > .desc { display:flex; align-items:center; gap:5px; }
.labels { display:flex; gap:4px; flex:0 1 auto; min-width:0; overflow:hidden; }
.labels:empty { display:none; }
.subject { flex:1 1 0; min-width:120px; overflow:hidden; text-overflow:ellipsis; }
.crow.wc .subject { font-weight:700; }
.hash, .date { font-family:var(--mono); font-size:12px; color:var(--dim); }
.author { color:var(--dim); }
.label { flex:none; display:flex; max-width:320px; overflow:hidden; white-space:nowrap; padding:0 6px; border-radius:3px; background:var(--lc); color:#fff; font-size:11px; font-weight:600; line-height:16px; }
.label-name { overflow:hidden; text-overflow:ellipsis; }
.label-track { flex:none; margin:0 -6px 0 6px; padding:0 5px; background:#6b6b6b; color:#fff; font-weight:500; }
.label.tag { background:transparent; color:var(--lc); box-shadow:inset 0 0 0 1px var(--lc); }
.label.current::before { content:'✓'; margin-right:4px; }
.label.head { background:#16a34a; }

/* Changed files */
.pane-head { flex:none; display:flex; align-items:center; gap:8px; height:26px; padding:0 8px; background:var(--panel); border-bottom:1px solid var(--border); color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; user-select:none; }
.pane-head b { color:var(--text); font-weight:600; }
.pane-head .spacer { flex:1; }
.pane-head.top { border-top:1px solid var(--border); }
.files { flex:1; min-height:40px; overflow:auto; outline:0; position:relative; }
.file-row { display:flex; align-items:center; gap:7px; height:22px; padding:0 8px; white-space:nowrap; cursor:default; user-select:none; }
.file-row:hover { background:var(--row-hover); }
.file-row.selected { background:var(--hover); }
.file-row.current { box-shadow:inset 3px 0 0 var(--accent); }
.pane-head input[type=checkbox] { margin-right:2px; }
.file-row .pick { flex:none; }
.row-actions { flex:none; position:sticky; right:4px; margin-left:auto; display:flex; gap:3px; visibility:hidden; }
.file-row:hover .row-actions, .file-row.selected .row-actions { visibility:visible; }
.row-action { all:unset; width:22px; height:18px; border-radius:4px; background:var(--panel2); color:var(--text);
  font:700 14px/18px var(--mono); text-align:center; cursor:pointer; }
.row-action.more { font-size:9px; letter-spacing:1px; }
.row-action:hover { background:var(--accent); color:#fff; }
.files-rows { width:max-content; min-width:100%; }
.file-path { padding-right:8px; }
.file-dir { color:var(--dim); }
.fstat { flex:none; width:16px; height:16px; border-radius:3px; color:#fff; font:700 10px/16px var(--mono); text-align:center; }
.fstat.mod { background:#d9822b; } .fstat.add { background:#2f9e44; } .fstat.del { background:#d64545; }
.fstat.ren { background:#3d7fd9; } .fstat.new { background:#868e96; } .fstat.conflict { background:#e03131; } .fstat.other { background:#8a63d2; }

/* Commit details */
.cinfo { flex:none; max-height:50%; overflow:auto; display:flex; gap:12px; padding:10px 12px; border-top:1px solid var(--border); }
.avatar { flex:none; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:14px; }
.cinfo-main { flex:1; min-width:0; }
.cinfo-msg { margin:0 0 10px; white-space:pre-wrap; word-break:break-word; font:13px/1.45 -apple-system, "Segoe UI", sans-serif; }
.cinfo-grid { display:grid; grid-template-columns:auto minmax(0, 1fr); gap:3px 12px; color:var(--dim); font-size:12px; }
.cinfo-grid .v { color:var(--text); overflow-wrap:anywhere; }
.link { color:var(--link); cursor:pointer; font-family:var(--mono); }
.link:hover { text-decoration:underline; }

/* Diff */
.diff { flex:1; min-height:0; min-width:0; overflow:auto; background:var(--bg); font:12px/1.5 var(--mono); }
.diff-title { position:sticky; top:0; left:0; z-index:2; display:flex; align-items:center; gap:8px; height:26px; padding:0 10px; background:var(--panel); border-bottom:1px solid var(--border); font:600 12px -apple-system, "Segoe UI", sans-serif; white-space:nowrap; }
.diff-content { min-width:max-content; }
.diff.wrap .diff-content { min-width:0; }
.hunk-head { display:flex; align-items:center; gap:10px; padding:3px 10px; background:var(--panel2); color:var(--dim); border-bottom:1px solid var(--border); font:12px -apple-system, "Segoe UI", sans-serif; }
.hunk-head:not(:first-child) { border-top:1px solid var(--border); margin-top:8px; }
.hunk-ctx { font-family:var(--mono); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hunk-head .spacer { flex:1; }
.dl { display:flex; white-space:pre; }
.diff.wrap .dl { white-space:pre-wrap; word-break:break-all; }
.dl .n { flex:none; width:46px; padding-right:8px; text-align:right; color:var(--dim); opacity:.75; user-select:none; }
.dl .t { flex:1; padding:0 10px; }
.dl.add { background:var(--add-bg); } .dl.add .n { background:var(--add-num); }
.dl.del { background:var(--del-bg); } .dl.del .n { background:var(--del-num); }
.dl.meta, .dl.head { color:var(--dim); font-style:italic; }
.diff-note { padding:24px 16px; color:var(--dim); text-align:center; font:13px -apple-system, "Segoe UI", sans-serif; }

/* Working copy */
.banner { flex:none; display:flex; align-items:center; gap:12px; padding:6px 10px; background:rgba(229,160,13,.16); border-bottom:1px solid var(--border); }
.banner span { flex:1; }
.banner.undo-bar { background:rgba(0,122,204,.14); }
.window.wide { max-width:min(940px, 96vw); }
.rewrite-msg { height:150px; min-width:480px; }
.rebase-list { width:min(880px, 88vw); max-height:44vh; overflow:auto; background:var(--bg); border:1px solid var(--border); border-radius:4px; }
.rebase-row { display:grid; grid-template-columns:18px 104px 70px minmax(0, 1fr) 140px; align-items:center; gap:8px; height:28px; padding:0 8px 0 4px; border-bottom:1px solid var(--border); background:var(--bg); }
.rebase-row select { padding:2px 4px; }
.rebase-row .drag { cursor:grab; color:var(--dim); text-align:center; user-select:none; }
.rebase-row .hash { font:12px var(--mono); color:var(--dim); }
.rebase-row .subject, .rebase-row .author { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.rebase-row .author { color:var(--dim); font-size:12px; }
.rebase-row.selected { background:var(--hover); }
.rebase-row.drop .subject { text-decoration:line-through; color:var(--dim); }
.rebase-row.squash .subject, .rebase-row.fixup .subject { color:var(--dim); }
.rebase-row.invalid { box-shadow:inset 3px 0 var(--danger); }
.rebase-label { margin:10px 0 4px; font-size:12px; }
.rebase-msg { display:block; width:100%; height:110px; margin-bottom:8px; }
.commit-box { flex:none; display:flex; flex-direction:column; gap:8px; padding:8px; background:var(--panel); border-top:1px solid var(--border); }
.commit-msg { height:84px; min-height:44px; resize:vertical; padding:6px 8px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; font:13px/1.45 -apple-system, "Segoe UI", sans-serif; }
.commit-msg:focus { outline:1px solid var(--accent); border-color:var(--accent); }
.commit-row { display:flex; align-items:center; gap:16px; }
.commit-row .spacer { flex:1; }
.commit-row .hint { font-size:12px; }

/* Status bar */
.status { flex:none; display:flex; align-items:center; gap:18px; padding:3px 10px; background:var(--accent); color:#fff; font-size:12px; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; }
.status-spacer { flex:1; }
.status button { all:unset; padding:0 8px; border-radius:3px; background:rgba(255,255,255,.18); font-weight:600; cursor:pointer; }
.status button:hover { background:rgba(255,255,255,.32); }
.status button:empty, .status span:empty { display:none; }

/* Windows (<dialog>), toast, outputs */
.window { position:fixed; inset:auto; z-index:2000; margin:0; padding:0; flex-direction:column; min-width:320px; max-width:min(680px, 94vw); max-height:90vh; overflow:visible; outline:0; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; box-shadow:0 10px 40px rgba(0,0,0,.5); }
.window[open] { display:flex; }
.window::backdrop { background:rgba(0,0,0,.45); }
.window-title { display:flex; align-items:center; padding:8px 8px 8px 14px; border-bottom:1px solid var(--border); font-weight:600; cursor:move; user-select:none; }
.window-title span { flex:1; }
.window-close { all:unset; padding:2px 8px; border-radius:4px; color:var(--dim); cursor:pointer; }
.window-close:hover { background:#c0392b; color:#fff; }
.window-body { padding:14px; overflow:auto; }
.window-body p { margin:0; line-height:1.5; }
.window-body .list { margin-top:10px; border:1px solid var(--border); border-radius:4px; padding:2px; height:230px; }
.window-footer { display:flex; justify-content:flex-end; gap:8px; padding:10px 14px; border-top:1px solid var(--border); }
.toast { position:fixed; inset:auto auto 44px 50%; transform:translateX(-50%); z-index:6000; max-width:80vw; margin:0; padding:8px 16px; border:0; border-radius:6px; background:#000c; color:#fff; opacity:0; transition:opacity .2s; pointer-events:none; }
.toast.show { opacity:1; }
.about { display:flex; align-items:center; gap:14px; line-height:1.6; }
.canvas { display:block; flex:none; }
pre.output { margin:0; max-width:620px; max-height:55vh; overflow:auto; padding:8px 10px; background:var(--bg); border:1px solid var(--border); border-radius:4px; font:12px/1.45 var(--mono); white-space:pre-wrap; word-break:break-word; }
pre.file-sample { margin:10px 0; max-height:170px; }
.window-body .form-note { margin-top:8px; }
.cmdlog { width:min(620px, 86vw); max-height:60vh; overflow:auto; display:flex; flex-direction:column; gap:10px; }
.cmd-head { display:flex; gap:10px; margin-bottom:4px; font-size:12px; color:var(--dim); }
.cmd-head b { color:var(--text); }
.cmd-head .ok { color:var(--success); } .cmd-head .fail { color:var(--danger); }
</style>
</head>
<body>
<!-- The whole UI is built by App.ui.init() -->

<script>
'use strict';

// --- Global Error Handler (SHARED) ---
function flashError(message) {
    console.error(message);
    document.body.classList.add('error-flash');
    setTimeout(() => document.body.classList.remove('error-flash'), 300);
}
window.onerror = (message, source, line, col) => flashError(`Error (${line}:${col}): ${message}`);
window.onunhandledrejection = e => flashError('Unhandled rejection: ' + (e.reason?.stack || e.reason));

const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

// --- App errors ---
// An expected failure ("not found", bad input). Commands throw it; App.run shows the message as a toast.
class UserError extends Error {}

// --- UI Component Library ---
class UI {

    // ---------- Core (SHARED) ----------

    static uid = 0;          // last generated id (field ids, radio group names)

    // children: nodes, strings, components ({ node }) or arrays of them; null / false / '' are skipped.
    static createNode(tag, props = {}, ...children) {
        const el = document.createElement(tag);
        Object.entries(props).forEach(([key, val]) => {
            if (val == null) return;
            if (key === 'on') Object.entries(val).forEach(([event, fn]) => el.addEventListener(event, fn));
            else if (key === 'dataset') Object.assign(el.dataset, val);
            else if (key === 'classList') el.classList.add(...val);
            else if (key === 'style') { if (typeof val === 'string') el.style.cssText = val; else Object.assign(el.style, val); }
            else if (key in el) el[key] = val;
            else el.setAttribute(key, val);
        });
        children.flat(Infinity).forEach(c => c != null && c !== false && c !== '' && el.append(c.node || c));
        return el;
    }

    // Writes the text only when it differs, so a refresh leaves unchanged nodes alone.
    static setText(el, text) {
        text = String(text ?? '');
        if (el.textContent !== text) el.textContent = text;
    }

    // Fires the bubbling `input` event that forms listen to. Native fields fire it themselves; a composite control
    // calls this when its value changes in a way the browser does not report.
    static notify(node) {
        node.dispatchEvent(new Event('input', { bubbles: true }));
    }

    // Keyed rendering. Returns sync(items, ...extra) that keeps one child of `parent` per item, matched by item.id.
    // make(item) builds a row once and returns { node, update(item, ...extra) }; later calls only update it.
    // Rows that stay are never detached, so focus, hover and a click or drag in progress survive a refresh.
    static keyed(parent, make) {
        let rows = new Map();
        return (items, ...extra) => {
            const next = new Map(items.map(item => [item.id, rows.get(item.id) || make(item)]));
            rows.forEach((row, id) => { if (!next.has(id)) row.node.remove(); });
            items.forEach((item, i) => {
                const row = next.get(item.id);
                row.update(item, ...extra);
                if (parent.children[i] !== row.node) parent.insertBefore(row.node, parent.children[i] || null);
            });
            rows = next;
        };
    }

    // Pointer drag on `handle`. onStart(e) returns the move handler, or nothing to ignore the press.
    static onDrag(handle, onStart, onEnd) {
        handle.addEventListener('pointerdown', e => {
            const onMove = e.button === 0 && onStart(e);
            if (!onMove) return;
            e.preventDefault();
            handle.setPointerCapture(e.pointerId);
            handle.addEventListener('pointermove', onMove);
            handle.addEventListener('lostpointercapture', () => { handle.removeEventListener('pointermove', onMove); onEnd?.(); }, { once: true });
        });
    }

    // ---------- Drag to reorder ----------

    // Drag-to-reorder for the `item` children of `container` (tabs: axis 'x', side sections: axis 'y').
    // The item stays in place as a ghost, a copy follows the pointer, a marker shows the drop slot.
    // onMove(from, to) fires on release with indices among the visible items; Esc cancels.
    static makeSortable(container, { item, handle = item, axis = 'x', onMove }) {
        const [start, end, size, client] = axis === 'x' ? ['left', 'right', 'width', 'clientX'] : ['top', 'bottom', 'height', 'clientY'];
        const items = () => [...container.querySelectorAll(item)].filter(el => el.offsetParent);
        let justDragged = false;

        container.addEventListener('pointerdown', down => {
            const el = down.target.closest(handle)?.closest(item);
            if (!el || down.button !== 0 || down.target.closest('button, input, select, label')) return;
            const press = new AbortController();              // the listeners below live only while the button is down
            let clone, marker, grab, from, to;

            const move = e => {
                const list = items();
                from = list.indexOf(el);
                if (from < 0) return finish(false);
                if (!clone) {
                    if (Math.hypot(e.clientX - down.clientX, e.clientY - down.clientY) < 5) return;       // a plain click stays a click
                    const r = el.getBoundingClientRect();
                    grab = down[client] - r[start];
                    clone = el.cloneNode(true);
                    clone.classList.add('drag-clone');
                    Object.assign(clone.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px' });
                    marker = this.createNode('div', { className: 'drop-marker ' + axis,
                        style: axis === 'x' ? { top: r.top + 'px', height: r.height + 'px' } : { left: r.left + 'px', width: r.width + 'px' } });
                    el.classList.add('drag-ghost');
                    document.body.append(clone, marker);
                }
                const pos = e[client] - grab, center = pos + clone.getBoundingClientRect()[size] / 2;
                const rects = list.map(x => x.getBoundingClientRect());
                // slot = index to insert before; it changes when the copy's centre crosses the near border of another item
                let slot = from;
                for (let k = 0; k < from; k++) if (center < rects[k][end]) { slot = k; break; }
                if (slot === from) for (let k = list.length - 1; k > from; k--) if (center > rects[k][start]) { slot = k + 1; break; }
                const before = rects[slot - 1], after = rects[slot];
                to = slot > from ? slot - 1 : slot;
                clone.style[start] = pos + 'px';
                marker.hidden = to === from;
                marker.style[start] = (before && after ? (before[end] + after[start]) / 2 : after ? after[start] : before[end]) + 'px';
            };
            const finish = commit => {
                press.abort();
                if (!clone) return;
                clone.remove();
                marker.remove();
                el.classList.remove('drag-ghost');
                justDragged = true;
                setTimeout(() => { justDragged = false; });
                if (commit && from >= 0 && to !== from) onMove(from, to);
            };
            const listen = (target, type, fn) => target.addEventListener(type, fn, { signal: press.signal });
            listen(document, 'pointermove', move);
            listen(document, 'pointerup', () => finish(true));
            listen(document, 'pointercancel', () => finish(false));
            listen(document, 'keydown', e => { if (e.key === 'Escape') finish(false); });
            listen(window, 'blur', () => finish(false));
        });
        container.addEventListener('click', e => { if (justDragged) e.stopPropagation(); }, true);     // swallow the click that ends a drag
    }

    // ---------- Menus ----------

    // Popup menu at (x, y). items: [{ title, key, checked, disabled, run }], '-' is a separator.
    // One menu is open at a time; it closes on a press outside, Esc or window blur.
    static showMenu(items, x, y, owner = null) {
        this.closeMenu();
        const open = new AbortController(), { signal } = open;
        const node = this.createNode('div', { className: 'menu', on: { mousedown: e => e.preventDefault() } },      // keep the focus where it is
            items.map(item => item === '-' ? this.createNode('hr') : this.createNode('div', {
                className: 'menu-item' + (item.disabled ? ' disabled' : ''),
                on: { click: () => { this.closeMenu(); item.run(); } },
            },
                this.createNode('span', { className: 'menu-check' }, item.checked && '✓'),
                this.createNode('span', { className: 'menu-title' }, item.title),
                this.createNode('span', { className: 'menu-key' }, item.key))));
        document.body.append(node);
        node.style.left = clamp(x, 0, innerWidth - node.offsetWidth - 4) + 'px';
        node.style.top = clamp(y, 0, innerHeight - node.offsetHeight - 4) + 'px';
        owner?.classList.add('open');
        document.addEventListener('mousedown', e => { if (!e.target.closest('.menu, .menubar-item')) this.closeMenu(); }, { signal });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') this.closeMenu(); }, { signal });
        window.addEventListener('blur', () => this.closeMenu(), { signal });
        this.menu = { node, owner, open };
    }

    static closeMenu() {
        if (!this.menu) return;
        this.menu.open.abort();
        this.menu.node.remove();
        this.menu.owner?.classList.remove('open');
        this.menu = null;
    }

    // Menu bar. menus: { Title: items }. resolve(items) runs on every open, so checks and disabled states are always fresh.
    static createMenuBar({ menus, resolve = items => items }) {
        const info = this.createNode('span', { className: 'menubar-info' });
        const node = this.createNode('div', { className: 'menubar' }, Object.entries(menus).map(([title, items]) => {
            const open = () => { const r = top.getBoundingClientRect(); this.showMenu(resolve(items), r.left, r.bottom + 1, top); };
            const top = this.createNode('div', { className: 'menubar-item', on: {
                mousedown: e => { e.preventDefault(); if (this.menu?.owner === top) this.closeMenu(); else open(); },
                mouseenter: () => { if (this.menu?.owner && this.menu.owner !== top) open(); },      // slide from one open menu to the next
            } }, title);
            return top;
        }), info);
        return { node, setInfo: text => { this.setText(info, text); info.title = text; } };     // selectable, full text in the tooltip
    }

    // ---------- Shell ----------

    // Tab strip. update(tabs, activeId) with tabs: [{ id, title, dirty, color }].
    // Press selects, ✕ or middle click closes, drag reorders, right click calls onContext(id, x, y).
    static createTabs({ onSelect, onClose, onAdd, onMove, onContext }) {
        const node = this.createNode('div', { className: 'tabs' },
            this.createNode('button', { className: 'tab-add', title: 'New tab', on: { click: () => onAdd() } }, '+'));
        const sync = this.keyed(node, ({ id }) => {
            const dot = this.createNode('i', { className: 'dot' }), title = this.createNode('span', { className: 'tab-title' });
            const tab = this.createNode('div', { className: 'tab', on: {
                mousedown: e => { if (e.target.closest('button')) return; e.preventDefault(); if (e.button === 0) onSelect(id); },
                auxclick: e => { if (e.button === 1) onClose(id); },
                contextmenu: e => { e.preventDefault(); onContext?.(id, e.clientX, e.clientY); },
            } }, dot, title, this.createNode('button', { className: 'tab-close', title: 'Close tab', on: { click: () => onClose(id) } }, '✕'));
            return { node: tab, update: (item, activeId) => {
                tab.classList.toggle('active', id === activeId);
                tab.title = item.title;
                this.setText(title, (item.dirty ? '● ' : '') + item.title);
                dot.hidden = !item.color;
                dot.style.background = item.color || '';
            } };
        });
        let shown;
        const update = (tabs, activeId) => {
            sync(tabs, activeId);
            if (activeId !== shown) node.querySelector('.active')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
            shown = activeId;
        };
        this.makeSortable(node, { item: '.tab', onMove });
        return { node, update };
    }

    // Tabs that switch views in one area: no close, add or drag. update(items, activeId) with items: [{ id, title, count }];
    // onSelect(id).
    static createViewTabs({ onSelect }) {
        const node = this.createNode('div', { className: 'tabs view-tabs' });
        const sync = this.keyed(node, ({ id }) => {
            const title = this.createNode('span', { className: 'tab-title' }), count = this.createNode('span', { className: 'view-tab-count' });
            const tab = this.createNode('div', { className: 'tab', on: {
                mousedown: e => { if (e.button === 0) { e.preventDefault(); onSelect(id); } },
            } }, title, count);
            return { node: tab, update: (item, activeId) => {
                tab.classList.toggle('active', id === activeId);
                this.setText(title, item.title);
                this.setText(count, item.count ? String(item.count) : '');
                count.hidden = !item.count;
            } };
        });
        return { node, update: (items, activeId) => sync(items, activeId) };
    }

    // Side panel: a column of sections (createSection, each with an id). Click a title to collapse, drag a title to reorder,
    // drag the inner edge to resize. edge: 'right' | 'left' - the side of the window the panel sits on.
    // layout: { width, order: [ids], collapsed: [ids] } - pass the saved one in, onLayout reports every change.
    static createSidePanel({ sections, layout = {}, edge = 'right', onLayout }) {
        const rank = s => { const i = (layout.order || []).indexOf(s.id); return i < 0 ? sections.length : i; };
        const list = this.createNode('div', { className: 'side-sections' }, [...sections].sort((a, b) => rank(a) - rank(b)));
        const resizer = this.createNode('div', { className: 'side-resizer' });
        const node = this.createNode('aside', { className: 'side ' + edge, style: { width: (layout.width || 270) + 'px' } }, resizer, list);
        sections.forEach(s => s.node.classList.toggle('collapsed', (layout.collapsed || []).includes(s.id)));
        const report = () => onLayout?.({
            width: node.offsetWidth,
            order: [...list.children].map(s => s.dataset.id),
            collapsed: [...list.querySelectorAll('.collapsed')].map(s => s.dataset.id),
        });

        list.addEventListener('click', e => {
            const title = e.target.closest('h4');
            if (!title || e.target.closest('button, input, label')) return;
            title.parentNode.classList.toggle('collapsed');
            report();
        });
        this.makeSortable(list, { item: '.section', handle: 'h4', axis: 'y', onMove: (from, to) => {
            const visible = [...list.children].filter(s => s.offsetParent), moved = visible.splice(from, 1)[0];
            list.insertBefore(moved, visible[to] || null);
            report();
        } });
        this.onDrag(resizer, e => {
            const dir = edge === 'left' ? 1 : -1, base = node.offsetWidth - dir * e.clientX;
            return ev => { node.style.width = clamp(base + dir * ev.clientX, 180, 600) + 'px'; };
        }, report);
        return { node, setVisible: visible => { node.hidden = !visible; } };
    }

    // Status bar. items: [{ id, title, onClick } | { spacer: true }]; an item with onClick is a button. set({ id: text }).
    static createStatusBar(items) {
        const cells = {};
        const node = this.createNode('div', { className: 'status' }, items.map(item => item.spacer
            ? this.createNode('span', { className: 'status-spacer' })
            : (cells[item.id] = this.createNode(item.onClick ? 'button' : 'span', { title: item.title, on: { click: () => item.onClick?.() } }))));
        return {
            node,
            set: values => Object.entries(values).forEach(([id, text]) => this.setText(cells[id], text)),
            setVisible: visible => { node.hidden = !visible; },
        };
    }

    // Toolbar of big icon buttons. items: [{ id, title, tip, icon, onClick(event), onContext(event) } | '|' | { spacer: true }];
    // icon is a micro-DSL drawing (see drawIcon) in a 24x24 box centred on 0,0, $c = the icon colour.
    // The events let a button react to modifier keys (Ctrl+click; on macOS Ctrl+click arrives as a context menu event).
    // update({ id: { disabled, badge } }) - a badge is a small number on the button's corner ('' or 0 hides it).
    static createToolbar(items, color = '#3d8bfd') {
        const tools = {};
        const node = this.createNode('div', { className: 'toolbar' }, items.map(item => {
            if (item === '|') return this.createNode('span', { className: 'toolbar-sep' });
            if (item.spacer) return this.createNode('span', { className: 'toolbar-spacer' });
            const badge = this.createNode('span', { className: 'tool-badge', hidden: true });
            const button = this.createNode('button', { type: 'button', className: 'tool', title: item.tip || item.title,
                on: { click: e => item.onClick(e), contextmenu: e => item.onContext?.(e) } },
                this.createIconCanvas({ width: 24, height: 24, source: item.icon, vars: { c: color } }), item.title, badge);
            tools[item.id] = { button, badge };
            return button;
        }));
        return {
            node,
            update: values => Object.entries(values).forEach(([id, { disabled = false, badge = '' }]) => {
                const tool = tools[id];
                if (!tool) return;
                tool.button.disabled = disabled;
                tool.badge.hidden = !badge;
                this.setText(tool.badge, badge || '');
            }),
        };
    }

    // Two panes with a draggable border between them. axis 'x': side by side, 'y': one above the other.
    // The `fixed` pane ('first' | 'second') keeps `size` px, the other one takes the rest; onResize(size) after a drag.
    static createSplit({ axis = 'x', first, second, fixed = 'first', size = 300, min = 60, onResize }) {
        const a = this.createNode('div', { className: 'pane' }, first), b = this.createNode('div', { className: 'pane' }, second);
        const [pinned, free] = fixed === 'first' ? [a, b] : [b, a];
        const prop = axis === 'x' ? 'width' : 'height', client = axis === 'x' ? 'clientX' : 'clientY';
        const handle = this.createNode('div', { className: 'split-handle' });
        const node = this.createNode('div', { className: 'split ' + axis }, a, handle, b);
        let current;
        const setSize = px => { current = px; pinned.style[prop] = px + 'px'; };
        free.classList.add('flex');
        pinned.style[axis === 'x' ? 'maxWidth' : 'maxHeight'] = `calc(100% - ${min}px)`;
        setSize(size);
        this.onDrag(handle, e => {
            const start = e[client], base = pinned.getBoundingClientRect()[prop], dir = fixed === 'first' ? 1 : -1;
            const total = node.getBoundingClientRect()[prop];
            handle.classList.add('drag');
            return ev => setSize(Math.round(clamp(base + dir * (ev[client] - start), min, total - min)));
        }, () => { handle.classList.remove('drag'); onResize?.(current); });
        return { node, setSize: px => { if (px !== current) setSize(px); } };
    }

    // ---------- Windows (SHARED) ----------

    static topZ = 2000;      // z-index of the window that was raised last

    // Draggable window on top of <dialog>. It is created closed: show() opens it, and on an open window only raises and
    // focuses it - so a window kept in a variable cannot be opened twice.
    // modal (default) blocks the page behind it and traps the focus; modal: false leaves the page usable.
    // buttons: [{ label, primary, keep, run }]; a click closes the window unless `keep` is set or run() resolves to false.
    // Enter presses the primary button, Esc closes. at: 'center' | 'top-right' is where it first appears.
    static createWindow({ title, content = [], buttons = [{ label: 'Close', primary: true }], modal = true, at = 'center', onClose }) {
        const body = this.createNode('div', { className: 'window-body' }, content);
        const footer = this.createNode('div', { className: 'window-footer' }, buttons.map(b => this.createButton({
            label: b.label, kind: b.primary ? 'primary' : '',
            onClick: async () => { if (await b.run?.() !== false && !b.keep) close(); },
        })));
        const titleBar = this.createNode('div', { className: 'window-title' },
            this.createNode('span', {}, title),
            this.createNode('button', { className: 'window-close', title: 'Close', on: { click: () => close() } }, '✕'));
        const node = this.createNode('dialog', { className: 'window', on: {
            pointerdown: () => raise(),
            cancel: e => { e.preventDefault(); close(); },        // the browser's own Esc handling of a modal dialog
            keydown: e => {
                if (e.key === 'Escape') close();
                else if (e.key === 'Enter' && !e.target.closest('textarea, button')) footer.querySelector('.primary')?.click();
                else return;
                e.preventDefault();
            },
        } }, titleBar, body, footer);

        const moveTo = (x, y) => { node.style.left = clamp(x, 0, innerWidth - 60) + 'px'; node.style.top = clamp(y, 0, innerHeight - 40) + 'px'; };
        const raise = () => { if (+node.style.zIndex !== this.topZ) node.style.zIndex = ++this.topZ; };
        const show = () => {
            if (!node.open) {
                document.body.append(node);
                if (modal) node.showModal(); else node.show();
                if (node.style.left) moveTo(node.offsetLeft, node.offsetTop);         // reopened: where the user left it
                else if (at === 'top-right') moveTo(innerWidth - node.offsetWidth - 24, 56);
                else moveTo((innerWidth - node.offsetWidth) / 2, Math.max(20, (innerHeight - node.offsetHeight) / 3));
            }
            raise();
            const field = body.querySelector('input, select, textarea') || footer.querySelector('.primary');
            field?.focus();
            field?.select?.();
            return win;
        };
        const close = () => {
            if (!node.open) return;
            node.close();             // the dialog hands the focus back to where it came from
            node.remove();
            onClose?.();
        };
        this.onDrag(titleBar, e => {
            if (e.target.closest('button')) return;
            const dx = e.clientX - node.offsetLeft, dy = e.clientY - node.offsetTop;
            return ev => moveTo(ev.clientX - dx, ev.clientY - dy);
        });
        const win = { node, show, close, isOpen: () => node.open };
        return win;
    }

    // Modal question; resolves to true when the user confirms.
    static confirm(message, okLabel = 'OK') {
        return new Promise(resolve => this.createWindow({
            title: 'Confirm', content: this.createNode('p', {}, message), onClose: () => resolve(false),
            buttons: [{ label: okLabel, primary: true, run: () => resolve(true) }, { label: 'Cancel' }],
        }).show());
    }

    static toast(message) {
        const node = this.toastNode ||= document.body.appendChild(this.createNode('div', { className: 'toast', popover: 'manual' }));
        node.textContent = message;
        node.togglePopover?.(false);
        node.togglePopover?.(true);       // (re)enter the top layer, so the toast is above an open modal window too
        node.classList.add('show');
        clearTimeout(this.toastTimer);
        this.toastTimer = setTimeout(() => node.classList.remove('show'), 2600);
    }

    // ---------- Sections and read-outs (SHARED) ----------

    // Titled block. `actions` (buttons, badges) sit at the right end of the title row.
    static createSection({ id, title, actions = [], content = [], className = '' }) {
        const heading = this.createNode('span', { className: 'section-title' }, title);
        const node = this.createNode('section', { className: ('section ' + className).trim(), dataset: id && { id } },
            this.createNode('h4', {}, heading, this.createNode('span', { className: 'section-actions' }, actions)), content);
        return {
            node, id,
            append: component => node.append(component.node || component),
            setTitle: text => this.setText(heading, text),
            setVisible: visible => { node.hidden = !visible; },
        };
    }

    // Key / value read-outs. update(rows) with rows: [[key, value]]; values are right-aligned with fixed-width digits.
    static createReadouts({ label, rows = [] } = {}) {
        const node = this.createNode('table', { className: 'readouts' });
        const sync = this.keyed(node, ({ id }) => {
            const value = this.createNode('td');
            return { node: this.createNode('tr', {}, this.createNode('td', {}, id), value), update: row => this.setText(value, row.value) };
        });
        const update = rows => sync(rows.map(([id, value]) => ({ id, value })));
        update(rows);
        return { node, label, update };
    }

    // ---------- Lists and trees ----------

    // Clickable rows. update(items): every item needs a stable `id`. render(item) -> { title, detail, color };
    // actions: [{ icon, title, run(item) }] are row buttons.
    static createList({ emptyText = '', render = item => item, actions = [], onSelect }) {
        const empty = this.createNode('div', { className: 'hint' }, emptyText);
        const node = this.createNode('div', { className: 'list' }, empty);
        const sync = this.keyed(node, first => {
            let item = first;
            const dot = this.createNode('i', { className: 'dot' });
            const title = this.createNode('span', { className: 'list-title' }), detail = this.createNode('span', { className: 'list-detail' });
            const row = this.createNode('div', { className: 'list-item', on: { click: () => onSelect?.(item) } }, dot, title, detail,
                actions.map(a => this.createNode('button', { className: 'icon-button', title: a.title,
                    on: { click: e => { e.stopPropagation(); a.run(item); } } }, a.icon)));
            return { node: row, update: next => {
                item = next;
                const view = render(item);
                row.title = view.title;
                this.setText(title, view.title);
                this.setText(detail, view.detail);
                dot.hidden = !view.color;
                dot.style.background = view.color || '';
            } };
        });
        const update = items => { sync(items); empty.hidden = items.length > 0; };
        return { node, update };
    }

    // Tree of rows, given already flattened: update(rows, selectedId) with only the visible rows
    // [{ id, depth, title, folder, open, detail, bold, color, tooltip }]. A press on a folder calls onToggle(row),
    // on a leaf onSelect(row); double click onOpen(row); right click onContext(row, x, y).
    static createTree({ emptyText = '', onSelect, onOpen, onToggle, onContext }) {
        const empty = this.createNode('div', { className: 'hint' }, emptyText);
        const node = this.createNode('div', { className: 'tree' }, empty);
        const sync = this.keyed(node, first => {
            let row = first;
            const arrow = this.createNode('span', { className: 'tree-arrow' }), dot = this.createNode('i', { className: 'dot' });
            const title = this.createNode('span', { className: 'tree-title' }), badge = this.createNode('span', { className: 'tree-badge' });
            const el = this.createNode('div', { className: 'tree-row', on: {
                mousedown: e => { if (e.button !== 0) return; if (row.folder) onToggle?.(row); else onSelect?.(row); },
                dblclick: () => { if (!row.folder) onOpen?.(row); },
                contextmenu: e => { e.preventDefault(); if (!row.folder) onContext?.(row, e.clientX, e.clientY); },
            } }, arrow, dot, title, badge);
            return { node: el, update: (next, selectedId) => {
                row = next;
                el.style.setProperty('--depth', next.depth || 0);
                el.classList.toggle('folder', !!next.folder);
                el.classList.toggle('bold', !!next.bold);
                el.classList.toggle('selected', next.id === selectedId);
                el.title = next.tooltip || next.title;
                this.setText(arrow, next.folder ? (next.open ? '▾' : '▸') : '');
                this.setText(title, next.title);
                this.setText(badge, next.detail || '');
                dot.hidden = !next.color;
                dot.style.background = next.color || '';
            } };
        });
        return { node, update: (rows, selectedId) => { sync(rows, selectedId); empty.hidden = rows.length > 0; } };
    }

    // ---------- Form controls (SHARED) ----------
    // Controls return { node, label, input, getValue, setValue, setDisabled }. `node` is the bare control - the label is laid
    // out by createForm - so a control fits a form, a toolbar or a table cell alike. `input` is the element a click on the
    // label focuses. A control fires a bubbling `input` event when the user changes its value (see notify); setValue() is
    // silent, so pushing the state into the controls never loops back.

    static control(node, label, input, prop = 'value') {
        return {
            node, label, input,
            getValue: () => input[prop],
            setValue: v => { if (input[prop] !== v) input[prop] = v; },       // an unchanged value keeps the caret in place
            setDisabled: d => { input.disabled = d; },
        };
    }

    // kind: '' | 'primary' | 'success' | 'danger' | 'icon'; small: a compact button for table rows and title bars.
    static createButton({ label, title, kind = '', small = false, onClick }) {
        const className = kind === 'icon' ? 'icon-button' : ['button', kind, small && 'small'].filter(Boolean).join(' ');
        const node = this.createNode('button', { type: 'button', className, title, on: { click: e => onClick?.(e) } }, label);
        return { node, setLabel: text => this.setText(node, text), setDisabled: d => { node.disabled = d; } };
    }

    static createTextInput({ label, value = '', placeholder = '', onChange }) {
        const input = this.createNode('input', { type: 'text', value, placeholder, spellcheck: false, on: { input: () => onChange?.(input.value) } });
        return this.control(input, label, input);
    }

    // options: ['value', ...] or [['value', 'Text'], ...]
    static createSelect({ label, options = [], value, onChange }) {
        const select = this.createNode('select', { on: { change: () => onChange?.(select.value) } },
            options.map(o => { const [val, text = val] = [].concat(o); return this.createNode('option', { value: val }, text); }));
        if (value !== undefined) select.value = value;
        return this.control(select, label, select);
    }

    // The text sits next to the box, so a form leaves the label column empty.
    static createCheckbox({ label, value = false, onChange }) {
        const input = this.createNode('input', { type: 'checkbox', checked: value, on: { change: () => onChange?.(input.checked) } });
        return this.control(this.createNode('label', { className: 'check' }, input, label), '', input, 'checked');
    }

    // Range slider with a read-out of format(value); editable: true shows a number field instead, to type an exact value.
    static createSlider({ label, min = 0, max = 100, step = 1, value = min, format = String, editable = false, onChange }) {
        const range = this.createNode('input', { type: 'range', min, max, step, value });
        const readout = editable ? this.createNode('input', { type: 'number', min, max, step }) : this.createNode('span', { className: 'readout' });
        const show = () => {
            if (!editable) this.setText(readout, format(+range.value));
            else if (readout.value !== range.value) readout.value = range.value;
        };
        range.addEventListener('input', () => { show(); onChange?.(+range.value); });
        if (editable) {
            readout.addEventListener('input', () => { if (readout.value === '') return; range.value = readout.value; onChange?.(+range.value); });
            readout.addEventListener('change', show);         // out of range or empty: show the value the slider took
        }
        show();
        return {
            node: this.createNode('div', { className: 'slider' }, range, readout), label, input: editable ? readout : range,
            getValue: () => +range.value,
            setValue: v => { range.value = v; show(); },
            setDisabled: d => { range.disabled = readout.disabled = d; },
        };
    }

    // Form: a row per field (label | control), or the fields side by side with the label on top (columns: true).
    // fields: { name: control }; any other component with { node, label } (buttons, read-outs) is only laid out.
    // getValue() / setValue() / setDisabled() cover the controls; onChange(values) fires on every edit.
    // A form is a control itself, so it can be a field of another form.
    static createForm({ label, fields, note, columns = false, onChange }) {
        const all = Object.entries(fields), controls = all.filter(([, c]) => c.getValue);
        const getValue = () => Object.fromEntries(controls.map(([name, c]) => [name, c.getValue()]));
        const node = this.createNode('div', { className: columns ? 'form columns' : 'form', on: { input: () => onChange?.(getValue()) } },
            all.map(([, c]) => {
                if (c.input && c.label) c.input.id ||= 'field-' + ++this.uid;          // a click on the label focuses the control
                return this.createNode('div', { className: 'field' }, this.createNode('label', { htmlFor: c.input?.id }, c.label), c.node);
            }),
            note && this.createNode('div', { className: 'form-note' }, note));
        return {
            node, label, getValue,
            setValue: values => controls.forEach(([name, c]) => { if (name in values) c.setValue(values[name]); }),
            setDisabled: d => controls.forEach(([, c]) => c.setDisabled(d)),
        };
    }

    // ---------- Icons (SHARED) ----------

    // Canvas with a drawing in the vector micro-DSL (see drawIcon), centred; draw(source, vars) redraws it.
    static createIconCanvas({ label, source = '', width = 64, height = 64, vars = {} }) {
        const dpr = devicePixelRatio || 1;
        const node = this.createNode('canvas', { className: 'canvas', width: width * dpr, height: height * dpr, style: { width: width + 'px' } });
        const ctx = node.getContext('2d');
        const draw = (src = source, v = vars) => {
            source = src;
            vars = v;
            ctx.setTransform(dpr, 0, 0, dpr, width * dpr / 2, height * dpr / 2);
            ctx.clearRect(-width / 2, -height / 2, width, height);
            this.drawIcon(ctx, source, vars);
        };
        draw();
        return { node, label, draw };
    }

    // Vector micro-DSL: commands separated by ';', arguments by ','. $name is replaced from vars.
    // s:color stroke, f:color fill, w:width, cap:, join:, b begin path, z close, m:x,y move, l:x,y,... lines,
    // rr:x,y,w,h,r rounded rect, a:x,y,r,start,end,ccw arc, q: quadratic, c: bezier, S stroke, F fill.
    static drawIcon(ctx, str, vars = {}) {
        ctx.save();
        Object.assign(ctx, { strokeStyle: '#ddd', fillStyle: '#333', lineWidth: 1.5, lineCap: 'round', lineJoin: 'round' });
        ctx.beginPath();
        const resolved = str.replace(/\$([a-zA-Z0-9_]+)/g, (m, k) => vars[k] !== undefined ? vars[k] : m);
        for (const cmd of resolved.split(';').map(s => s.trim()).filter(Boolean)) {
            const [op, val] = cmd.split(':');
            const args = val ? val.split(',').map(v => (v.trim() !== '' && !isNaN(v)) ? +v : v.trim()) : [];
            switch (op.trim()) {
                case 's': ctx.strokeStyle = args[0]; break;
                case 'f': ctx.fillStyle = args[0]; break;
                case 'w': ctx.lineWidth = args[0]; break;
                case 'cap': ctx.lineCap = args[0]; break;
                case 'join': ctx.lineJoin = args[0]; break;
                case 'b': ctx.beginPath(); break;
                case 'z': ctx.closePath(); break;
                case 'm': ctx.moveTo(args[0], args[1]); break;
                case 'l': for (let j = 0; j < args.length; j += 2) ctx.lineTo(args[j], args[j + 1]); break;
                case 'rr': { const [x, y, w, h, r = 0] = args; if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); break; }
                case 'a': ctx.arc(args[0], args[1], args[2], args[3] ?? 0, args[4] ?? Math.PI * 2, !!args[5]); break;
                case 'q': ctx.quadraticCurveTo(args[0], args[1], args[2], args[3]); break;
                case 'c': ctx.bezierCurveTo(args[0], args[1], args[2], args[3], args[4], args[5]); break;
                case 'S': ctx.stroke(); break;
                case 'F': ctx.fill(); break;
            }
        }
        ctx.restore();
    }

    // ---------- Environment: theme, keyboard ----------

    // theme: 'dark' | 'light' | 'auto' (follow the system)
    static setTheme(theme) {
        const system = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme === 'auto' ? system : theme;
    }

    static isMac = /Mac|iPhone|iPad/.test(navigator.platform);
    static isWindows = /Win/.test(navigator.platform);

    // The browser's own context menu stays only where text is read or edited (`allow`: a CSS selector) and over
    // selected text; anywhere else a right click does nothing. Components with an app menu prevent it themselves.
    static limitContextMenu(allow) {
        document.addEventListener('contextmenu', e => {
            const selection = getSelection();
            if (e.defaultPrevented || e.target.closest?.(allow)) return;
            if (selection && !selection.isCollapsed && selection.containsNode(e.target, true)) return;
            e.preventDefault();
        });
    }

    // Shortcut of a keydown event, e.g. 'mod+shift+s' (mod = ⌘ on macOS, Ctrl elsewhere). Letters and digits do not depend
    // on the keyboard layout (so 'alt+1' works on macOS too, where Option+1 types '¡').
    static keyOf(e) {
        const key = /^Key[A-Z]$/.test(e.code) ? e.code[3].toLowerCase() : /^Digit\d$/.test(e.code) ? e.code[5] : (e.key || '').toLowerCase();
        return ((this.isMac ? e.metaKey : e.ctrlKey) ? 'mod+' : '') + (e.altKey ? 'alt+' : '') + (e.shiftKey ? 'shift+' : '') + key;
    }

    // 'mod+shift+s' -> '⇧⌘S' on macOS, 'Ctrl+Shift+S' elsewhere.
    static formatKey(shortcut = '') {
        const mods = shortcut.split('+'), key = mods.pop();
        const name = { arrowleft: '←', arrowright: '→', arrowup: '↑', arrowdown: '↓' }[key] || key.charAt(0).toUpperCase() + key.slice(1);
        if (this.isMac) return ['alt', 'shift', 'mod'].filter(m => mods.includes(m)).map(m => ({ alt: '⌥', shift: '⇧', mod: '⌘' })[m]).join('') + name;
        return [...mods.map(m => ({ mod: 'Ctrl', alt: 'Alt', shift: 'Shift' })[m]), name].filter(Boolean).join('+');
    }
}

// --- Git logic: pure functions, no DOM, no network ---

const WC = '*';       // hash of the "Uncommitted changes" row of the history
const PAGE = 500;     // commits per log request
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

const Git = {
    laneColors: ['#3b82f6', '#ef4444', '#f59e0b', '#22c55e', '#a855f7', '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#6366f1'],
    labelColors: { head: '#16a34a', branch: '#3b82f6', remote: '#a855f7', tag: '#d97706' },

    // Lanes of the commit graph. commits: newest first, [{ hash, parents }]. -> { rows, width }, a row per commit:
    // { col, color, lines: [[x1, y1, x2, y2, color]] } - x in lanes, y in row heights (0 top, .5 the commit, 1 bottom),
    // color = index into laneColors (modulo); a 6th item `true` marks a faint line (from the "Uncommitted changes" row
    // down to its parents: not committed yet). Each lane holds the hash it expects next. A branch keeps its lane down to
    // the commit it forked from; all lanes expecting a commit join it there. A merge opens a lane for each extra parent.
    graph(commits) {
        const lanes = [], colors = [], faint = [];
        let next = 0, width = 1;
        const free = () => { const i = lanes.indexOf(null); return i < 0 ? lanes.length : i; };
        const rows = commits.map(c => {
            const lines = [], wc = c.hash === WC;
            const line = (x1, y1, x2, y2, color, f) => lines.push(f ? [x1, y1, x2, y2, color, true] : [x1, y1, x2, y2, color]);
            let col = lanes.indexOf(c.hash);
            const known = col >= 0;
            if (!known) {             // a branch tip: nothing above leads here
                col = free();
                lanes[col] = c.hash;
                colors[col] = next++;
                faint[col] = false;
            }
            const color = colors[col];
            lanes.forEach((h, i) => {
                if (h == null) return;
                if (h !== c.hash) line(i, 0, i, 1, colors[i], faint[i]);                  // passes by
                else if (i !== col || known) line(i, 0, col, 0.5, colors[i], faint[i]);   // leads into this commit
            });
            lanes.forEach((h, i) => { if (h === c.hash) lanes[i] = null; });
            c.parents.forEach((p, k) => {
                let i = col;
                if (k === 0) {
                    lanes[col] = p;
                    colors[col] = color;
                    faint[col] = wc;
                } else {
                    i = lanes.indexOf(p);
                    if (i < 0) {
                        i = free();
                        lanes[i] = p;
                        colors[i] = next++;
                        faint[i] = wc;
                    }
                }
                line(col, 0.5, i, 1, colors[i], wc);
            });
            while (lanes.length && lanes[lanes.length - 1] == null) lanes.pop();
            lines.forEach(l => { width = Math.max(width, l[0] + 1, l[2] + 1); });
            width = Math.max(width, col + 1);
            return { col, color, lines };
        });
        return { rows, width };
    },

    // Ref labels of the commits: { hash: [{ type: 'head' | 'branch' | 'remote' | 'tag', name, current }] },
    // detached HEAD first, then the current branch, other branches, remote branches, tags.
    labels(refs) {
        const map = {};
        const add = (hash, label) => (map[hash] ||= []).push(label);
        if (refs.head.detached) add(refs.head.hash, { type: 'head', name: 'HEAD' });
        refs.branches.forEach(b => add(b.hash, { type: 'branch', name: b.name, current: b.current,
            ...(b.ahead || b.behind ? { track: [b.ahead && b.ahead + ' ahead', b.behind && b.behind + ' behind'].filter(Boolean).join(', ') } : {}) }));
        refs.remotes.forEach(r => add(r.hash, { type: 'remote', name: r.name }));
        refs.tags.forEach(t => add(t.hash, { type: 'tag', name: t.name }));
        Object.values(map).forEach(list => list.sort((a, b) => (b.current ? 1 : 0) - (a.current ? 1 : 0)));
        return map;
    },

    // Tree ids of the folders that hold a name: ('feature/ui/x', 'b:') -> ['b:feature/', 'b:feature/ui/'].
    folderIds(name, prefix) {
        const parts = name.split('/').slice(0, -1);
        return parts.map((p, i) => prefix + parts.slice(0, i + 1).join('/') + '/');
    },

    // Visible rows of a folder tree of slash-separated names ('feature/x'), depth first, sorted by name.
    // items: [{ name }]. Leaf: { id: prefix + name, depth, title, item }; folder: { id: prefix + path + '/', depth, title,
    // folder: true, open } - open is defaultOpen, flipped when `toggled` contains the folder id.
    tree(items, toggled, prefix, defaultOpen = true) {
        const root = new Map();
        for (const item of items) {
            let level = root;
            const parts = item.name.split('/');
            parts.forEach((part, i) => {
                if (!level.has(part)) level.set(part, { part, path: parts.slice(0, i + 1).join('/'), children: new Map(), item: null });
                const node = level.get(part);
                if (i === parts.length - 1) node.item = item;
                level = node.children;
            });
        }
        const rows = [];
        const walk = (level, depth) => [...level.values()].sort((a, b) => a.part.localeCompare(b.part)).forEach(node => {
            if (node.item) rows.push({ id: prefix + node.path, depth, title: node.part, item: node.item });
            if (!node.children.size) return;
            const id = prefix + node.path + '/', open = defaultOpen !== toggled.includes(id);
            rows.push({ id, depth, title: node.part, folder: true, open });
            if (open) walk(node.children, depth + 1);
        });
        walk(root, 0);
        return rows;
    },

    // Unified diff -> [{ header: [lines before the first hunk], binary, hunks }], a hunk:
    // { header, oldStart, oldLines, newStart, newLines, context, lines, raw } with lines
    // [{ type: 'add' | 'del' | 'ctx' | 'meta', text, old, new }] (1-based numbers, null on the side a line is not on);
    // raw = the hunk's own diff lines, for hunkPatch. Combined diffs (conflicts, '@@@') stay as header lines.
    parseDiff(text) {
        const files = [];
        let file = null, hunk = null, oldNo = 0, newNo = 0;
        const lines = text.split('\n');
        if (lines[lines.length - 1] === '') lines.pop();
        for (const line of lines) {
            if (line.startsWith('diff ')) {
                file = { header: [line], binary: false, hunks: [] };
                files.push(file);
                hunk = null;
                continue;
            }
            if (!file) files.push(file = { header: [], binary: false, hunks: [] });
            const m = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@ ?(.*)$/.exec(line);
            if (m) {
                hunk = { header: line, oldStart: +m[1], oldLines: m[2] === undefined ? 1 : +m[2], newStart: +m[3],
                    newLines: m[4] === undefined ? 1 : +m[4], context: m[5], lines: [], raw: [line] };
                file.hunks.push(hunk);
                [oldNo, newNo] = [hunk.oldStart, hunk.newStart];
                continue;
            }
            if (hunk && /^[ +\-\\]/.test(line)) {
                hunk.raw.push(line);
                const type = line[0], text = line.slice(1);
                if (type === '+') hunk.lines.push({ type: 'add', text, old: null, new: newNo++ });
                else if (type === '-') hunk.lines.push({ type: 'del', text, old: oldNo++, new: null });
                else if (type === ' ') hunk.lines.push({ type: 'ctx', text, old: oldNo++, new: newNo++ });
                else hunk.lines.push({ type: 'meta', text: text.trim(), old: null, new: null });
                continue;
            }
            hunk = null;
            file.header.push(line);
            if (/^(Binary files |GIT binary patch)/.test(line)) file.binary = true;
        }
        return files;
    },

    // Patch of one hunk for `git apply`: the file's header lines and the hunk.
    hunkPatch(file, hunk) {
        const header = file.header.filter(l => /^(diff |index |--- |\+\+\+ |(new|deleted) file mode |old mode |new mode |similarity index |rename (from|to) )/.test(l));
        return [...header, ...hunk.raw].join('\n') + '\n';
    },

    // /api/status lists -> the file objects the views and commands use: a stable id and the diff mode.
    wcFiles(status) {
        return {
            staged: status.staged.map(f => ({ ...f, id: 's:' + f.path, mode: 'staged' })),
            unstaged: status.unstaged.map(f => ({ ...f, id: 'u:' + f.path, mode: f.status === '?' ? 'untracked' : 'unstaged' })),
        };
    },

    // History row of the uncommitted changes: a child of HEAD and, while a merge waits for the commit, of the merged heads.
    wcCommit(head, mergeHeads = []) {
        return { hash: WC, parents: head ? [head, ...mergeHeads] : [], author: '', email: '', date: 0, subject: 'Uncommitted changes' };
    },

    // What the log shows depends on: when it changes (commit, fetch, checkout, other filter) the log is loaded again.
    logKey(refs, { scope, remotes, order }) {
        const named = [...refs.branches, ...(remotes ? refs.remotes : []), ...refs.tags].map(r => r.name + '=' + r.hash);
        return [scope, remotes, order, refs.head.hash, refs.head.branch, ...named, ...(refs.mergeHeads || []).map(h => 'merge=' + h)].join('\n');
    },

    // "Jump to" text -> hash: exact ref name, prefix of a loaded commit hash, part of a ref name, else the text itself.
    resolve(text, commits, refs) {
        const q = text.trim(), lower = q.toLowerCase();
        if (!q) return '';
        const named = refs ? [...refs.branches, ...refs.remotes, ...refs.tags] : [];
        const exact = named.find(r => r.name === q);
        if (exact) return exact.hash;
        const commit = /^[0-9a-f]{4,40}$/.test(lower) && commits.find(c => c.hash.startsWith(lower));
        if (commit) return commit.hash;
        return named.find(r => r.name.toLowerCase().includes(lower))?.hash || q;
    },

    // 'origin/feature/x' -> { remote: 'origin', branch: 'feature/x' } (the longest known remote name that fits).
    splitRemote(name, remoteNames) {
        const remote = [...remoteNames].sort((a, b) => b.length - a.length).find(r => name.startsWith(r + '/'));
        return remote ? { remote, branch: name.slice(remote.length + 1) } : { remote: '', branch: name };
    },

    // Web page of a remote repository (refs.webUrls) -> { kind, name }: kind 'github' | 'gitlab' | 'bitbucket' | 'azure'
    // picks the deep link format; '' = unknown hosting (only the repository page). name: for menu titles.
    hosting(web) {
        let host = '';
        try { host = new URL(web).hostname.toLowerCase(); } catch {}
        if (host === 'github.com' || host.startsWith('github.')) return { kind: 'github', name: 'GitHub' };
        if (host === 'gitlab.com' || host.startsWith('gitlab.')) return { kind: 'gitlab', name: 'GitLab' };
        if (host === 'bitbucket.org') return { kind: 'bitbucket', name: 'Bitbucket' };
        if (host === 'dev.azure.com') return { kind: 'azure', name: 'Azure DevOps' };
        return { kind: '', name: host || web };
    },

    // Link on a remote's web page. target: null (the repository), { branch }, { commit }, or either with `path` (a file
    // at that branch / commit). '' when the hosting's link format is unknown.
    webLink(web, target) {
        if (!target) return web;
        const { kind } = this.hosting(web), enc = s => s.split('/').map(encodeURIComponent).join('/');
        const { branch, commit, path } = target, ref = commit || branch;
        if (kind === 'github' || kind === 'gitlab') {
            const dash = kind === 'gitlab' ? '/-' : '';
            if (path) return `${web}${dash}/blob/${enc(ref)}/${enc(path)}`;
            return commit ? `${web}${dash}/commit/${commit}` : `${web}${dash}/tree/${enc(branch)}`;
        }
        if (kind === 'bitbucket') return path ? `${web}/src/${enc(ref)}/${enc(path)}` : commit ? `${web}/commits/${commit}` : `${web}/src/${enc(branch)}`;
        if (kind === 'azure') {
            const version = 'version=' + (commit ? 'GC' : 'GB') + encodeURIComponent(ref);
            if (path) return `${web}?path=${encodeURIComponent('/' + path)}&${version}`;
            return commit ? `${web}/commit/${commit}` : `${web}?${version}`;
        }
        return '';
    },

    // '2↑ 21↓' for a branch ahead / behind its upstream, 'gone' when the upstream was deleted.
    trackText(branch) {
        return [branch.ahead && branch.ahead + '↑', branch.behind && branch.behind + '↓', branch.gone && 'gone'].filter(Boolean).join(' ');
    },

    formatDate(seconds) {
        if (!seconds) return '';
        const d = new Date(seconds * 1000), pad = n => String(n).padStart(2, '0');
        return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    },

    // Stable colour of a name or e-mail (avatars).
    colorOf(text) {
        let h = 0;
        for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) | 0;
        return this.laneColors[Math.abs(h) % this.laneColors.length];
    },

    initials(name) {
        return name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
    },

    splitPath(path) {
        const i = path.lastIndexOf('/');
        return { dir: path.slice(0, i + 1), name: path.slice(i + 1) };
    },

    // Multi-selection of a list. ids: all ids in list order; picked: the picked ones; anchor: where a range starts.
    // mode: 'one' (click), 'toggle' (Ctrl/⌘ + click), 'range' (Shift + click), 'add-range' (Ctrl/⌘ + Shift + click).
    // -> { picked: ids in list order, anchor }
    pick(ids, picked, anchor, id, mode) {
        let next = [id];
        if (mode === 'toggle') {
            next = picked.includes(id) ? picked.filter(p => p !== id) : [...picked, id];
            anchor = id;
        } else if ((mode === 'range' || mode === 'add-range') && ids.includes(anchor)) {
            const [a, b] = [ids.indexOf(anchor), ids.indexOf(id)].sort((x, y) => x - y);
            next = [...(mode === 'add-range' ? picked : []), ...ids.slice(a, b + 1)];
        } else {
            anchor = id;
        }
        return { picked: ids.filter(i => next.includes(i)), anchor };
    },

    // Interactive rebase list, newest first as shown: [{ hash, action: pick | squash | fixup | drop, message, edited }].
    // squash / fixup rows join the nearest older pick row (drops are skipped). -> index of each row's group head:
    // a pick row is its own head; -1 for a drop, and for a squash / fixup with no pick below it (invalid).
