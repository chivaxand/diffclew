    rebaseHeads(rows) {
        const heads = [];
        let head = -1;
        for (let i = rows.length - 1; i >= 0; i--) {
            const a = rows[i].action;
            if (a === 'pick') head = i;
            heads[i] = a === 'drop' ? -1 : head;
        }
        return heads;
    },

    // Message of the group whose pick row is rows[head]: the user's text, or the messages of the pick and its squash
    // rows, oldest first (fixup messages are dropped, like git).
    rebaseMessage(rows, head, heads = this.rebaseHeads(rows)) {
        if (rows[head].edited != null) return rows[head].edited;
        const parts = [rows[head].message];
        for (let i = head - 1; i >= 0; i--) if (heads[i] === head && rows[i].action === 'squash') parts.push(rows[i].message);
        return parts.join('\n\n');
    },

    // The todo for the server, oldest first: [{ hash, action, message? }]. A pick row carries a message only when the
    // group's message is not its own one any more (squash rows joined, or the user edited it).
    rebaseTodo(rows) {
        const heads = this.rebaseHeads(rows);
        return rows.map((r, i) => {
            const item = { hash: r.hash, action: r.action };
            if (r.action === 'pick') {
                const message = this.rebaseMessage(rows, i, heads);
                if (message.trim() !== r.message.trim()) item.message = message;
            }
            return item;
        }).reverse();
    },

    // Copy of the list where list[from] has moved to index `to`.
    move(list, from, to) {
        const copy = [...list];
        copy.splice(to, 0, ...copy.splice(from, 1));
        return copy;
    },
};

// --- Views: app-specific components. State in through show() / update(), events out through callbacks ---

// Commit history as a virtual list (only the rows in view exist), the graph drawn per row on a canvas.
// show({ source, list, rows, width, labels, selected, more, emptyText }) - rows: Git.graph rows, or null for no graph (search);
// source names the list (history / search): when it changes, the selected row is scrolled into view again;
// onSelect(hash), onOpen(commit) on double click / Enter, onContext(commits, x, y), onMore() when the end comes into view.
// Several rows can be picked like files (Ctrl/⌘ + click, Shift + click, Shift + arrows): the picked set is the table's
// own view state; it starts again from the selected row when the selection changes from outside. onContext gets the
// picked commits (list order, newest first) when the clicked row is one of them.
function createCommitTable({ onSelect, onOpen, onContext, onMore }) {
    const ROW = 22, LANE = 14, PAD = 10;
    let view = { list: [], rows: null, width: 1, labels: {}, selected: '' }, revealed = '', source = '', picked = [], anchor = '';
    const modeOf = e => {
        const mod = UI.isMac ? e.metaKey : e.ctrlKey;
        return e.shiftKey ? (mod ? 'add-range' : 'range') : mod ? 'toggle' : 'one';
    };
    const choose = (hash, mode) => {
        ({ picked, anchor } = Git.pick(view.list.map(c => c.hash), picked, anchor, hash, mode));
        render();
        if (picked.includes(hash)) onSelect(hash);        // the details follow the clicked row
    };
    const pickedCommits = () => view.list.filter(c => picked.includes(c.hash));
    const graphWidth = () => view.rows ? clamp(PAD * 2 + (view.width - 1) * LANE, 64, 320) : 0;
    const head = UI.createNode('div', { className: 'crow chead' }, ['Graph', 'Description', 'Commit', 'Author', 'Date'].map(t => UI.createNode('span', {}, t)));
    const spacer = UI.createNode('div', { className: 'cspacer' });
    const body = UI.createNode('div', { className: 'cbody', on: { scroll: () => render() } }, spacer);
    const empty = UI.createNode('div', { className: 'empty-hint' });

    const draw = (canvas, g, wc, width) => {
        const dpr = devicePixelRatio || 1;
        if (canvas.width !== width * dpr || canvas.height !== ROW * dpr) {
            Object.assign(canvas, { width: width * dpr, height: ROW * dpr });
            Object.assign(canvas.style, { width: width + 'px', height: ROW + 'px' });
        }
        const ctx = canvas.getContext('2d'), x = i => PAD + i * LANE, color = i => Git.laneColors[i % Git.laneColors.length];
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, ROW);
        if (!g) return;
        ctx.lineWidth = 2;
        for (const [x1, y1, x2, y2, c, faint] of g.lines) {
            const ax = x(x1), ay = y1 * ROW, bx = x(x2), by = y2 * ROW, my = (ay + by) / 2;
            ctx.globalAlpha = faint ? 0.5 : 1;     // lines of the uncommitted changes / merge
            ctx.strokeStyle = color(c);
            ctx.beginPath();
            ctx.moveTo(ax, ay);
            if (ax === bx) ctx.lineTo(bx, by); else ctx.bezierCurveTo(ax, my, bx, my, bx, by);
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(x(g.col), ROW / 2, 4.5, 0, Math.PI * 2);
        if (wc) {            // hollow dashed circle: the line below it must not show through
            ctx.save();
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fill();
            ctx.restore();
            ctx.setLineDash([2, 2]);
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = color(g.color);
            ctx.stroke();
            ctx.setLineDash([]);
        } else {
            ctx.fillStyle = color(g.color);
            ctx.fill();
        }
    };

    const sync = UI.keyed(spacer, () => {
        let commit, drawn = {}, labelKey = null;
        const canvas = UI.createNode('canvas');
        const labels = UI.createNode('span', { className: 'labels' }), subject = UI.createNode('span', { className: 'subject' });
        const hash = UI.createNode('span', { className: 'hash' }), author = UI.createNode('span', { className: 'author' });
        const date = UI.createNode('span', { className: 'date' });
        const row = UI.createNode('div', { className: 'crow', on: {
            mousedown: e => { if (e.button === 0) choose(commit.hash, modeOf(e)); },
            dblclick: e => { if (modeOf(e) === 'one') onOpen(commit); },
            contextmenu: e => {
                e.preventDefault();
                if (!picked.includes(commit.hash)) choose(commit.hash, 'one');
                onContext(pickedCommits(), e.clientX, e.clientY);
            },
        } }, canvas, UI.createNode('span', { className: 'desc' }, labels, subject), hash, author, date);
        return { node: row, update: ({ commit: c, index, graph }, gw) => {
            commit = c;
            row.style.top = index * ROW + 'px';
            row.classList.toggle('selected', picked.includes(c.hash));
            row.classList.toggle('current', c.hash === view.selected && picked.length > 1);
            row.classList.toggle('wc', c.hash === WC);
            row.title = c.subject;
            UI.setText(subject, c.subject);
            UI.setText(hash, c.hash === WC ? '' : c.hash.slice(0, 8));
            UI.setText(author, c.author && `${c.author} <${c.email}>`);
            UI.setText(date, Git.formatDate(c.date));
            const ls = view.labels[c.hash] || [], laneColor = graph && Git.laneColors[graph.color % Git.laneColors.length];
            const key = laneColor + ls.map(l => l.type + ':' + l.name + (l.current ? '*' : '') + (l.track || '')).join();
            if (key !== labelKey) {
                labelKey = key;
                labels.replaceChildren(...ls.map(l => UI.createNode('span', {
                    className: 'label ' + l.type + (l.current ? ' current' : ''), title: l.name + (l.track ? ` (${l.track})` : ''),
                    style: '--lc:' + (l.type === 'head' ? Git.labelColors.head : laneColor || Git.labelColors[l.type]),
                }, UI.createNode('span', { className: 'label-name' }, l.name), l.track && UI.createNode('span', { className: 'label-track' }, l.track))));
            }
            if (drawn.graph !== graph || drawn.gw !== gw) {
                drawn = { graph, gw };
                draw(canvas, graph, c.hash === WC, gw);
            }
        } };
    });

    const render = () => {
        const { list } = view;
        if (!body.clientHeight) return;      // hidden: the next show() renders
        const first = Math.max(0, Math.floor(body.scrollTop / ROW) - 8);
        const last = Math.min(list.length, Math.ceil((body.scrollTop + body.clientHeight) / ROW) + 8);
        const items = [];
        for (let i = first; i < last; i++) items.push({ id: list[i].hash, commit: list[i], index: i, graph: view.rows?.[i] });
        sync(items, graphWidth());
        if (view.more && last >= list.length - 4) onMore();
    };

    // Scrolls the selected row into view once per selection (a reloaded list keeps the user's scroll position).
    const reveal = () => {
        const i = view.list.findIndex(c => c.hash === view.selected);
        if (i < 0 || !body.clientHeight) return;
        revealed = view.selected;
        const top = i * ROW;
        if (top < body.scrollTop) body.scrollTop = top;
        else if (top + ROW > body.scrollTop + body.clientHeight) body.scrollTop = top + ROW - body.clientHeight;
    };

    const onKey = e => {
        const { list } = view, i = list.findIndex(c => c.hash === view.selected);
        const page = Math.max(1, Math.floor(body.clientHeight / ROW) - 1);
        if (e.key === 'Enter' && i >= 0) { e.preventDefault(); onOpen(list[i]); return; }
        const to = { ArrowDown: i + 1, ArrowUp: i - 1, PageDown: i + page, PageUp: i - page, Home: 0, End: list.length - 1 }[e.key];
        if (to === undefined || !list.length) return;
        e.preventDefault();
        choose(list[clamp(to, 0, list.length - 1)].hash, e.shiftKey ? 'range' : 'one');
    };

    const node = UI.createNode('div', { className: 'ctable', tabIndex: 0, on: { keydown: onKey } }, head, body, empty);
    // Only the rows in view exist: a new height (window resize, split drag, the table shown after it had no size)
    // needs new rows, and no show() or scroll comes with it.
    new ResizeObserver(() => render()).observe(body);
    return {
        node,
        show(next) {
            view = next;
            if (!picked.includes(view.selected)) ({ picked, anchor } = { picked: view.selected ? [view.selected] : [], anchor: view.selected });
            node.style.setProperty('--gw', graphWidth() + 'px');
            node.classList.toggle('no-graph', !view.rows);        // search results: no Graph column at all
            spacer.style.height = view.list.length * ROW + 'px';
            empty.hidden = view.list.length > 0;
            UI.setText(empty, view.emptyText || '');
            if (view.source !== source) revealed = '';     // another list (search <-> history): show the selection there too
            source = view.source;
            if (view.selected !== revealed) reveal();
            render();
        },
        focus: () => node.focus(),
    };
}

// Changed files. update(files, selectedId) with files: [{ id, path, oldPath, status, conflict }]; selectedId is the file
// whose diff is shown. Several files can be picked: click picks one, Ctrl (⌘ on macOS) + click toggles, Shift + click
// picks a range, Ctrl/⌘ + A all; Shift + arrows extends. The picked set is the list's own view state (like a scroll
// position); it goes out with the events: onContext(files, x, y), onCopy(files) on Ctrl/⌘ + C, onAction(files),
// onPick(files) after every change. getPicked() returns the picked files.
// pickBoxes: a checkbox on every row toggles its pick (a plain click on the box, no modifier needed), and
// `selectAllBox` - a checkbox for the list's header - picks all / none.
// action: { icon, title } - a button at the row's end (stage / unstage): onAction(the picked files when the row is one
// of them, else just the row's file). onMenu(files, x, y): a ••• button at the row's end opens the row's menu.
function createFileList({ emptyText = '', pickBoxes = false, action = null, onSelect, onOpen, onAction, onContext, onMenu, onCopy, onPick }) {
    const kinds = { M: 'mod', A: 'add', D: 'del', R: 'ren', C: 'ren', '?': 'new' };
    const empty = UI.createNode('div', { className: 'hint pad' }, emptyText);
    let files = [], selectedId = '', picked = [], anchor = '', listKey = '';
    let implicit = true;      // the picks only follow the shown file (set from outside), the user picked nothing yet
    const pickedFiles = () => files.filter(f => picked.includes(f.id));
    const targets = file => picked.includes(file.id) && picked.length > 1 ? pickedFiles() : [file];
    const modeOf = e => {
        const mod = UI.isMac ? e.metaKey : e.ctrlKey;
        return e.shiftKey ? (mod ? 'add-range' : 'range') : mod ? 'toggle' : 'one';
    };
    const selectAllBox = UI.createNode('input', { type: 'checkbox', title: 'Select all / none', tabIndex: -1, on: { click: e => {
        e.stopPropagation();
        picked = picked.length === files.length ? [] : files.map(f => f.id);
        implicit = false;
        paint();
    } } });
    const paint = () => {
        sync(files, selectedId);
        selectAllBox.checked = files.length > 0 && picked.length === files.length;
        selectAllBox.indeterminate = picked.length > 0 && picked.length < files.length;
        selectAllBox.disabled = !files.length;
        onPick?.(pickedFiles());
    };
    const choose = (file, mode) => {
        ({ picked, anchor } = Git.pick(files.map(f => f.id), picked, anchor, file.id, mode));
        implicit = false;
        paint();
        if (picked.includes(file.id)) onSelect(file);        // the diff follows the clicked file
    };
    const onKey = e => {
        const mod = UI.isMac ? e.metaKey : e.ctrlKey, key = e.key.toLowerCase();
        if (mod && key === 'a' && files.length) {
            e.preventDefault();
            picked = files.map(f => f.id);
            return paint();
        }
        if (mod && key === 'c' && picked.length && !getSelection()?.toString()) {
            e.preventDefault();
            return onCopy?.(pickedFiles());
        }
        const i = files.findIndex(f => f.id === selectedId), to = { ArrowDown: i + 1, ArrowUp: i - 1 }[e.key];
        if (to === undefined || !files.length) return;
        e.preventDefault();
        choose(files[clamp(to, 0, files.length - 1)], e.shiftKey ? 'range' : 'one');
    };
    const node = UI.createNode('div', { className: 'files', tabIndex: 0, on: { keydown: onKey } }, empty);
    // Full paths, never cut: the list scrolls both ways; rows share the width of the longest one (whole-row highlight).
    const rows = node.appendChild(UI.createNode('div', { className: 'files-rows' }));
    const sync = UI.keyed(rows, () => {
        let file;
        // no preventDefault: the browser would restore the box after the handler; paint() sets the same state anyway
        const box = pickBoxes && UI.createNode('input', { type: 'checkbox', className: 'pick', tabIndex: -1,
            // the first box ticked starts a fresh pick instead of adding to the file that was only shown
            on: { click: e => { e.stopPropagation(); choose(file, implicit && !picked.includes(file.id) ? 'one' : 'toggle'); } } });
        const button = action && UI.createNode('button', { type: 'button', className: 'row-action', title: action.title, tabIndex: -1,
            on: { click: e => { e.stopPropagation(); onAction(targets(file)); } } }, action.icon);
        const more = onMenu && UI.createNode('button', { type: 'button', className: 'row-action more', title: 'Actions', tabIndex: -1, on: { click: e => {
            e.stopPropagation();
            if (!picked.includes(file.id)) choose(file, 'one');
            const r = e.currentTarget.getBoundingClientRect();
            onMenu(pickedFiles(), r.left, r.bottom + 2);
        } } }, '•••');
        const actions = (button || more) && UI.createNode('span', { className: 'row-actions' }, button, more);
        const badge = UI.createNode('span', { className: 'fstat' });
        const dir = UI.createNode('span', { className: 'file-dir' }), name = UI.createNode('span', { className: 'file-name' });
        const own = e => !!e.target.closest('.pick, .row-actions');
        const row = UI.createNode('div', { className: 'file-row', on: {
            mousedown: e => { if (e.button === 0 && !own(e)) choose(file, modeOf(e)); },
            dblclick: e => { if (!own(e) && modeOf(e) === 'one') onOpen?.(file); },
            contextmenu: e => {
                e.preventDefault();
                if (!picked.includes(file.id)) choose(file, 'one');
                onContext?.(pickedFiles(), e.clientX, e.clientY);
            },
        } }, box, badge, UI.createNode('span', { className: 'file-path' }, dir, name), actions);
        return { node: row, update: (f, selected) => {
            file = f;
            const parts = Git.splitPath(f.path);
            UI.setText(dir, parts.dir);
            UI.setText(name, parts.name);
            UI.setText(badge, f.conflict ? '!' : f.status);
            badge.className = 'fstat ' + (f.conflict ? 'conflict' : kinds[f.status] || 'other');
            row.title = (f.oldPath ? f.oldPath + ' → ' : '') + f.path + (f.conflict ? `  (conflict: ${f.conflict})` : '');
            row.classList.toggle('selected', picked.includes(f.id));
            row.classList.toggle('current', f.id === selected && picked.length > 1);
            if (box) box.checked = picked.includes(f.id);
        } };
    });
    return {
        node, selectAllBox,
        getPicked: pickedFiles,
        update(next, selected = '') {
            files = next;
            picked = picked.filter(id => next.some(f => f.id === id));
            // selected from outside (another list, a reload that moved the files): pick just that file
            if ((selected !== selectedId || !picked.length) && !picked.includes(selected)) {
                picked = next.some(f => f.id === selected) ? [selected] : [];     // the shown file may be in the other list
                anchor = selected;
                implicit = true;
            }
            const key = next.map(f => f.id).join('\n'), moved = selected !== selectedId || key !== listKey;     // another file or another commit
            listKey = key;
            selectedId = selected;
            paint();
            empty.hidden = next.length > 0;
            if (moved && node.clientHeight) {       // a file chosen from outside (file history) may be far down a long list
                const row = rows.children[next.findIndex(f => f.id === selected)];
                if (row && (row.offsetTop < node.scrollTop || row.offsetTop + row.offsetHeight > node.scrollTop + node.clientHeight)) {
                    node.scrollTop = row.offsetTop - node.clientHeight / 3;
                }
            }
        },
    };
}

// Diff of one file. show({ file, diff, actions, wrap, note }) - diff: { files: Git.parseDiff(), truncated } | { loading } | null;
// actions: [{ id, label, kind }] become buttons on every hunk header: onHunk(id, fileIndex, hunkIndex).
function createDiffView({ onHunk }) {
    const MAX_LINES = 6000;
    const title = UI.createNode('span');
    const bar = UI.createNode('div', { className: 'diff-title' }, title);
    const content = UI.createNode('div', { className: 'diff-content' });
    const node = UI.createNode('div', { className: 'diff' }, bar, content);
    const note = text => UI.createNode('div', { className: 'diff-note' }, text);
    const num = n => UI.createNode('span', { className: 'n' }, n == null ? '' : String(n));
    let shown = {};

    const render = (file, diff, actions, empty) => {
        if (!file) return [note(empty || '')];
        if (!diff || diff.loading) return [note('Loading…')];
        const out = [];
        let count = 0;
        diff.files.forEach((f, fileIndex) => {
            if (f.binary) out.push(note('Binary file'));
            else if (!f.hunks.length) {         // mode changes, renames, or a combined diff of a conflict ('@@@', two-column prefixes)
                let combined = false;
                f.header.filter(l => !/^(diff |index |--- |\+\+\+ )/.test(l)).forEach(l => {
                    if (l.startsWith('@@@')) {
                        combined = true;
                        out.push(UI.createNode('div', { className: 'hunk-head' }, UI.createNode('span', { className: 'hunk-ctx' }, l)));
                        return;
                    }
                    const mark = combined ? l.slice(0, 2) : '';
                    const type = !combined ? 'head' : mark.includes('+') ? 'add' : mark.includes('-') ? 'del' : 'ctx';
                    out.push(UI.createNode('div', { className: 'dl ' + type }, num(), num(), UI.createNode('span', { className: 't' }, combined ? l.slice(2) || ' ' : l)));
                });
            }
            f.hunks.forEach((h, hunkIndex) => {
                out.push(UI.createNode('div', { className: 'hunk-head' },
                    UI.createNode('span', {}, `Hunk ${hunkIndex + 1} : Lines ${h.newStart}-${h.newStart + Math.max(h.newLines - 1, 0)}`),
                    UI.createNode('span', { className: 'hunk-ctx' }, h.context),
                    UI.createNode('span', { className: 'spacer' }),
                    actions.map(a => UI.createButton({ label: a.label, kind: a.kind, small: true, onClick: () => onHunk(a.id, fileIndex, hunkIndex) }))));
                for (const line of h.lines) {
                    if (count++ >= MAX_LINES) continue;
                    out.push(UI.createNode('div', { className: 'dl ' + line.type }, num(line.old), num(line.new),
                        UI.createNode('span', { className: 't' }, line.text || ' ')));
                }
            });
        });
        if (!diff.files.length) out.push(note('No changes to show'));
        if (count > MAX_LINES) out.push(note(`${count - MAX_LINES} more lines are not shown`));
        if (diff.truncated) out.push(note('The diff is too big: the rest is cut'));
        return out;
    };

    return {
        node,
        show({ file = null, diff = null, actions = [], wrap = false, empty = '' }) {
            node.classList.toggle('wrap', wrap);
            bar.hidden = !file;
            UI.setText(title, file ? (file.oldPath ? `${file.oldPath} → ${file.path}` : file.path) : '');
            const key = actions.map(a => a.id).join() + '|' + empty;
            if (shown.diff === diff && shown.file === file && shown.key === key) return;
            if (shown.file?.id !== file?.id) node.scrollTop = 0;       // the same file reloaded keeps its scroll position
            shown = { diff, file, key };
            content.replaceChildren(...render(file, diff, actions, empty));
        },
    };
}

// Message and metadata of a commit. show(info, labels); onParent(hash) when a parent link is clicked.
function createCommitDetails({ onParent }) {
    const node = UI.createNode('div', { className: 'cinfo' });
    let shown = {};
    return {
        node,
        show(info, labels) {
            if (shown.info === info && shown.labels === labels) return;
            shown = { info, labels };
            node.hidden = !info;
            if (!info) return;
            const ls = labels[info.hash] || [];
            const person = (name, email) => `${name} <${email}>`;
            const rows = info.hash === WC ? [] : [
                ['Commit', `${info.hash} [${info.hash.slice(0, 8)}]`],
                info.parents.length && ['Parents', info.parents.flatMap((p, i) => [i ? ', ' : '',
                    UI.createNode('span', { className: 'link', title: p, on: { click: () => onParent(p) } }, p.slice(0, 10))])],
                ['Author', person(info.author, info.email)],
                ['Date', Git.formatDate(info.date)],
                (info.committer !== info.author || info.committerEmail !== info.email) && ['Committer', person(info.committer, info.committerEmail)],
                ls.length && ['Labels', ls.map(l => l.name).join(', ')],
            ].filter(Boolean);
            node.replaceChildren(...[
                info.hash !== WC && UI.createNode('div', { className: 'avatar', style: 'background:' + Git.colorOf(info.email || info.author) }, Git.initials(info.author)),
                UI.createNode('div', { className: 'cinfo-main' },
                    UI.createNode('pre', { className: 'cinfo-msg' }, info.message),
                    UI.createNode('div', { className: 'cinfo-grid' }, rows.flatMap(([k, v]) => [UI.createNode('span', {}, k + ':'), UI.createNode('span', { className: 'v' }, v)]))),
            ].filter(Boolean));
        },
    };
}

// Commit message and options. show({ message, amend, push, pushTarget, staged, busy }); the user's edits go out through
// onChange({ message } | { amend } | { push }), the Commit button and ⌘Enter through onCommit().
function createCommitBox({ onChange, onCommit }) {
    let sent = null;        // the message the box last reported or was given: tells a command's change from the user's own
    const area = UI.createNode('textarea', { className: 'commit-msg', placeholder: 'Commit message', spellcheck: false, on: {
        input: () => { sent = area.value; onChange({ message: area.value }); },
        keydown: e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); onCommit(); } },
    } });
    const amend = UI.createCheckbox({ label: 'Amend last commit', onChange: amend => onChange({ amend }) });
    const push = UI.createCheckbox({ label: 'Push changes immediately', onChange: push => onChange({ push }) });
    const info = UI.createNode('span', { className: 'hint' });
    const button = UI.createButton({ label: 'Commit', kind: 'primary', onClick: () => onCommit() });
    const node = UI.createNode('div', { className: 'commit-box' }, area,
        UI.createNode('div', { className: 'commit-row' }, amend, push, UI.createNode('span', { className: 'spacer' }), info, button));
    return {
        node,
        show(s) {
            if (s.message !== sent) { area.value = s.message; sent = s.message; }
            amend.setValue(s.amend);
            push.setValue(s.push);
            push.node.title = s.pushTarget ? 'Push to ' + s.pushTarget : 'The branch has no remote yet';
            UI.setText(info, `${s.staged} staged · ${UI.formatKey('mod+enter')} commits`);
            button.setDisabled(!!s.busy);
        },
        focus: () => area.focus(),
    };
}

// The git write commands that ran, newest first. update(entries) with entries: [{ id, time, repo, label, ok, output }].
function createCommandLog() {
    const empty = UI.createNode('div', { className: 'hint' }, 'No commands yet');
    const node = UI.createNode('div', { className: 'cmdlog' }, empty);
    const sync = UI.keyed(node, entry => ({
        node: UI.createNode('div', {},
            UI.createNode('div', { className: 'cmd-head' },
                UI.createNode('span', {}, new Date(entry.time).toLocaleTimeString()),
                UI.createNode('b', {}, entry.repo),
                UI.createNode('span', {}, entry.label),
                UI.createNode('span', { className: entry.ok ? 'ok' : 'fail' }, entry.ok ? '✓ done' : '✗ failed')),
            UI.createNode('pre', { className: 'output' }, entry.output || '(no output)')),
        update: () => {},
    }));
    return { node, update: entries => { sync(entries); empty.hidden = entries.length > 0; } };
}

// --- Api: the server ---

const Api = {
    // POST /api/<name> with a JSON body. Any failure (server down, git error, bad input) -> UserError with the message.
    async call(name, body = {}) {
        let response;
        try {
            response = await fetch('/api/' + name, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-DiffClew': '1' }, body: JSON.stringify(body) });
        } catch {
            throw new UserError('The server is not reachable: is diffclew.py running?');
        }
        const text = await response.text();
        let data = null;
        try { data = JSON.parse(text); } catch {}
        if (!response.ok) throw new UserError(data?.error || text || `${response.status} ${response.statusText}`);
        return data;
    },
};

// --- App: settings, state, commands ---

// A menu command bound to a setting: a toggle, or one choice out of several when `value` is given.
const setting = (title, name, value) => ({
    title,
    checked: () => value === undefined ? App.settings[name] : App.settings[name] === value,
    run: () => App.configure({ [name]: value === undefined ? !App.settings[name] : value }),
});

// Same for the history filters: changing one loads the log again.
const filter = (title, name, value) => ({
    title,
    enabled: () => !!App.repo?.refs,
    checked: () => value === undefined ? App.settings[name] : App.settings[name] === value,
    run: () => App.setFilter({ [name]: value === undefined ? !App.settings[name] : value }),
});

const REVEAL = UI.isMac ? 'Show in Finder' : UI.isWindows ? 'Show in Explorer' : 'Show in folder';
const hasRepo = () => !!App.repo;
const ready = () => !!App.repo?.refs;
const changes = repo => new Set([...repo.files.staged, ...repo.files.unstaged].map(f => f.path)).size;     // changed files
const stateName = state => state === 'squash' ? 'squash merge' : state;      // refs.state in texts
// Remote branches whose deletion (rename on the remote) needs the word "delete"; same list as PROTECTED_BRANCHES in diffclew.py.
const PROTECTED_BRANCHES = new Set(['main', 'master', 'develop', 'development', 'dev', 'trunk', 'release', 'staging', 'production', 'prod']);

const App = {
    settings: {                       // saved in localStorage
        theme: 'dark', sidePanel: true, statusBar: true, side: { collapsed: ['tags', 'remotes'] }, repos: [], active: '',
        scope: 'all', remotes: true, order: 'date', context: 3, ignoreWs: false, wrapDiff: false,
        detailsHeight: 320, filesWidth: 420, wcWidth: 420, stagedHeight: 200, historyStagedHeight: 130,
    },
    state: { repos: [], activeId: 0, nextId: 1, home: '', console: [], browser: { input: '', path: '', parent: '', dirs: [] } },
    colors: ['#e06c75', '#e5c07b', '#98c379', '#56b6c2', '#61afef', '#c678dd'],

    get repo() { return this.state.repos.find(r => r.id === this.state.activeId); },

    // ---------- CORE: the same in every app ----------

    init() {
        try { Object.assign(this.settings, JSON.parse(localStorage.getItem('diffclew'))); } catch {}
        this.keymap = Object.fromEntries(Object.entries(this.commands).filter(([, c]) => c.key).map(([id, c]) => [c.key, id]));
        this.ui.init();
        this.run('start');
    },

    // The only way to change the state: runs a command, then schedules a refresh - right away for what the command set
    // before its first await (busy flags, selection), and again when it ends.
    // Resolves to false when the command is disabled or refuses with a UserError (shown as a toast).
    async run(id, ...args) {
        const command = this.commands[id];
        if (command.enabled?.() === false) return false;
        try {
            const pending = command.run(...args);
            this.ui.invalidate();
            await pending;
        } catch (error) {
            if (!(error instanceof UserError)) throw error;       // a bug: leave it to the global error handler
            UI.toast(error.message);
            return false;
        } finally {
            this.ui.invalidate();
        }
    },

    // The only place where settings change, so they are saved exactly when they change. Call it from commands.
    configure(patch) {
        Object.assign(this.settings, patch);
        try { localStorage.setItem('diffclew', JSON.stringify(this.settings)); } catch {}
    },

    // Menu items for a list of command ids ('-' is a separator).
    // A command with items() stands for its own list of items (none, one or several).
    menuItems(ids) {
        return ids.flatMap(id => {
            const c = this.commands[id];
            if (!c) return ['-'];
            if (c.items) return c.items();
            return [{ title: c.title, key: UI.formatKey(c.key), checked: c.checked?.(), disabled: c.enabled?.() === false, run: () => this.run(id) }];
        });
    },

    // ---------- Commands ----------
    // A command with a title can go into a menu or the toolbar; the ones without are fired by components and menus with args.

    commands: {
        start:          { run: async () => {
                            const { repos, home } = await Api.call('initial');
                            App.state.home = home;
                            App.settings.repos.forEach(path => App.addTab(path, path.split('/').pop()));
                            repos.forEach(r => App.addTab(r.path, r.name));
                            App.saveRepos();
                            const repo = App.state.repos.find(r => r.path === (App.settings.active || repos[0]?.path)) || App.state.repos[0];
                            if (repo) return App.activate(repo);
                            App.ui.openWindow.show();
                            return App.browse(home);
                        } },

        // Repositories (tabs)
        openRepo:       { title: 'Open repository…', key: 'mod+o', run: () => {
                            App.ui.openWindow.show();
                            return App.browse(App.state.browser.path || (App.repo ? App.repo.path.replace(/\/[^/]+$/, '') : App.state.home));
                        } },
        browseInput:    { run: text => { App.state.browser.input = text; } },
        browse:         { run: path => App.browse(path) },
        addRepo:        { run: async path => {
                            const { path: top, name } = await Api.call('open', { path });
                            const repo = App.state.repos.find(r => r.path === top) || App.addTab(top, name);
                            App.saveRepos();
                            return App.activate(repo);
                        } },
        selectTab:      { run: id => App.activate(App.state.repos.find(r => r.id === id)) },
        moveTab:        { run: (from, to) => { App.state.repos = Git.move(App.state.repos, from, to); App.saveRepos(); } },
        nextTab:        { title: 'Next tab', key: 'f6', enabled: () => App.state.repos.length > 1, run: () => App.stepTab(1) },
        prevTab:        { title: 'Previous tab', key: 'shift+f6', enabled: () => App.state.repos.length > 1, run: () => App.stepTab(-1) },
        closeTab:       { title: 'Close tab', enabled: hasRepo, run: (id = App.repo.id) => App.closeTab(id) },
        closeOthers:    { title: 'Close other tabs', enabled: () => App.state.repos.length > 1, run: () => {
                            App.state.repos = [App.repo];
                            App.saveRepos();
                        } },
        refresh:        { title: 'Refresh', key: 'mod+r', enabled: hasRepo, run: () => App.reload(App.repo, true) },
        autoRefresh:    { run: () => {           // the window got the focus back: the user may have run git elsewhere
                            const repo = App.repo;
                            if (!repo?.refs || Date.now() - (App.lastAuto || 0) < 1500) return;
                            App.lastAuto = Date.now();
                            return App.reload(repo);
                        } },

        // Views
        viewStatus:     { title: 'File status', key: 'alt+1', enabled: hasRepo, checked: () => App.repo?.view === 'status', run: () => App.showView('status') },
        viewHistory:    { title: 'History', key: 'alt+2', enabled: hasRepo, checked: () => App.repo?.view === 'history', run: () => App.showView('history') },
        viewSearch:     { title: 'Search', key: 'alt+3', enabled: hasRepo, checked: () => App.repo?.view === 'search', run: () => App.showView('search') },
        showView:       { run: view => App.showView(view) },
        toggleFolder:   { run: id => {
                            const { toggled } = App.repo;
                            App.repo.toggled = toggled.includes(id) ? toggled.filter(t => t !== id) : [...toggled, id];
                        } },

        // History and search
        loadMore:       { run: () => App.loadLog(App.repo, true) },
        selectCommit:   { run: hash => {
                            const repo = App.repo, s = repo.search;
                            repo.sideSel = '';
                            // file history: show that file in the commit (its path then, before a rename)
                            const path = repo.view === 'search' && s.mode === 'history' ? s.commits?.find(c => c.hash === hash)?.path || s.text : '';
                            return App.selectCommit(repo, hash, path);
                        } },
        // Double click / Enter on a row: "Uncommitted changes" opens File status; a search result opens in the History
        // (loading more history until it is there; when the filters hide it, they switch to all branches).
        openCommit:     { run: async commit => {
                            const repo = App.repo;
                            if (commit.hash === WC) return App.showView('status');
                            if (repo.view !== 'search') return;
                            await App.jump(repo, commit.hash);
                            const shown = () => repo.log.commits.some(c => c.hash === commit.hash);
                            if (!shown() && (App.settings.scope !== 'all' || !App.settings.remotes)) {
                                await App.setFilter({ scope: 'all', remotes: true });
                                await App.jump(repo, commit.hash);
                                if (shown()) UI.toast('History switched to all branches to show this commit');
                            }
                        } },
        selectFile:     { run: file => App.selectFile(App.repo, file) },
        jumpTo:         { run: text => App.jump(App.repo, text) },
        jumpToRef:      { run: (hash, sideId) => { App.repo.sideSel = sideId; return App.jump(App.repo, hash); } },
        selectStash:    { run: (stash, sideId) => {
                            const repo = App.repo;
                            repo.sideSel = sideId;
                            if (repo.view === 'status') repo.view = 'history';
                            return App.selectCommit(repo, stash.hash);
                        } },
        setFilter:      { run: values => App.setFilter(values) },
        scopeAll:       filter('All branches', 'scope', 'all'),
        scopeCurrent:   filter('Current branch', 'scope', 'current'),
        scopeFirst:     filter('Current branch only (no merged commits)', 'scope', 'first'),
        showRemotes:    filter('Show remote branches', 'remotes'),
        orderDate:      filter('Date order', 'order', 'date'),
        orderTopo:      filter('Ancestor order', 'order', 'topo'),
        setSearch:      { run: patch => { Object.assign(App.repo.search, patch); } },
        search:         { run: () => App.search(App.repo) },
        // Right click on a file: the commits that changed it (across renames) in the Search view; a click shows the
        // file's diff in that commit, a double click opens the commit in the History.
        fileHistory:    { run: async path => {
                            const repo = App.repo;
                            Object.assign(repo.search, { text: path, mode: 'history' });
                            repo.view = 'search';
                            await App.search(repo);
                            if (repo.search.commits?.length) await App.selectCommit(repo, repo.search.commits[0].hash, repo.search.commits[0].path);
                        } },

        // Working copy
        selectWcFile:   { run: file => App.selectWcFile(App.repo, file) },
        stage:          { run: files => App.git(App.repo, 'stage', { paths: files.map(f => f.path) }, 'Stage') },
        unstage:        { run: files => App.git(App.repo, 'unstage', { paths: files.flatMap(f => f.oldPath ? [f.path, f.oldPath] : [f.path]) }, 'Unstage') },
        stageAll:       { title: 'Stage all', enabled: () => App.repo?.files.unstaged.length > 0, run: () => App.git(App.repo, 'stage', { paths: ['.'] }, 'Stage all') },
        unstageAll:     { title: 'Unstage all', enabled: () => App.repo?.files.staged.length > 0, run: () => App.git(App.repo, 'unstage', { paths: ['.'] }, 'Unstage all') },
        discard:        { run: async files => {
                            const untracked = files.filter(f => f.mode === 'untracked'), tracked = files.filter(f => f.mode !== 'untracked');
                            const what = files.length === 1 ? files[0].path : files.length + ' files';
                            const message = `Discard all changes in ${what}? This cannot be undone.` + (untracked.length ? ' Untracked files are deleted.' : '');
                            if (!await UI.confirm(message, 'Discard')) return;
                            return App.git(App.repo, 'discard', { paths: tracked.map(f => f.path), untracked: untracked.map(f => f.path) }, 'Discard');
                        } },
        discardAll:     { title: 'Discard all changes…', enabled: () => App.repo?.files.unstaged.length > 0, run: () => App.run('discard', App.repo.files.unstaged.filter(f => !f.conflict)) },
        hunk:           { run: async (action, fileIndex, hunkIndex, source = 'wc') => {      // source: the File status or the History diff
                            const repo = App.repo, file = (source === 'sel' ? repo.sel.diff : repo.wc.diff).files[fileIndex];
                            const patch = Git.hunkPatch(file, file.hunks[hunkIndex]);
                            if (action === 'discard' && !await UI.confirm('Discard this hunk? This cannot be undone.', 'Discard hunk')) return;
                            const params = { stage: { cached: true }, unstage: { cached: true, reverse: true }, discard: { reverse: true } }[action];
                            const label = { stage: 'Stage hunk', unstage: 'Unstage hunk', discard: 'Discard hunk' }[action];
                            return App.git(repo, 'apply_patch', { patch, zero: App.settings.context === 0, ...params }, label);
                        } },
        setCommit:      { run: async patch => {
                            const repo = App.repo, wc = repo.wc;
                            Object.assign(wc, patch);
                            if (patch.amend && !wc.message.trim()) {          // amend: start from the last commit's message
                                const info = await App.request(repo, 'head', 'commit', { hash: 'HEAD' });
                                if (info && wc.amend && !wc.message.trim()) wc.message = info.message;
                            }
                        } },
        commitView:     { title: 'Commit…', enabled: hasRepo, run: async () => { await App.showView('status'); App.ui.commitBox.focus(); } },
        commit:         { run: async () => {
                            const repo = App.repo, wc = repo.wc;
                            if (!wc.message.trim()) throw new UserError('Write a commit message first');
                            if (!repo.files.staged.length && !wc.amend && !repo.refs.state) throw new UserError('Nothing is staged: check the files to commit');
                            await App.git(repo, 'commit', { message: wc.message, amend: wc.amend }, wc.amend ? 'Amend commit' : 'Commit');
                            const push = wc.push;
                            Object.assign(wc, { message: '', amend: false, push: false });     // the options are for this commit only
                            await App.showView('history');                        // the new commit, selected
                            await App.selectCommit(repo, repo.refs.head.hash);
                            if (push) await App.git(repo, 'push', App.pushParams(repo), 'Push');
                        } },

        // Git actions: a dialog command (title, toolbar) opens a dialog whose button runs the action command.
        fetchDialog:    { title: 'Fetch…', enabled: () => ready() && App.repo.refs.remoteNames.length > 0, run: () => App.ui.openFetch() },
        fetch:          { run: params => App.git(App.repo, 'fetch', params, 'Fetch') },
        pullDialog:     { title: 'Pull…', enabled: () => ready() && App.repo.refs.remotes.length > 0, run: () => App.ui.openPull() },
        pull:           { run: params => App.git(App.repo, 'pull', params, 'Pull') },
        pushDialog:     { title: 'Push…', enabled: () => ready() && App.repo.refs.remoteNames.length > 0, run: name => App.ui.openPush(name) },
        push:           { run: params => App.git(App.repo, 'push', params, 'Push') },
        branchDialog:   { title: 'New branch…', enabled: () => ready() && !!App.repo.refs.head.hash, run: start => App.ui.openBranch(start) },
        branch:         { run: params => App.git(App.repo, 'branch', params, 'Create branch ' + params.name) },
        mergeDialog:    { title: 'Merge…', enabled: () => ready() && !!App.repo.refs.head.hash, run: ref => App.ui.openMerge(ref) },
        merge:          { run: params => App.prepare(App.repo, 'merge', params, (params.squash ? 'Squash merge ' : 'Merge ') + params.ref) },
        mergeToDialog:  { title: 'Merge current branch into…', enabled: () => ready() && !!App.repo.refs.head.branch && App.repo.refs.branches.length > 1,
                          run: target => App.ui.openMergeTo(target) },
        mergeTo:        { run: async params => {
                            const repo = App.repo, label = `${params.squash ? 'Squash merge' : 'Merge'} ${repo.refs.head.branch} into ${params.target}`;
                            await App.prepare(repo, 'merge_to', params, label);
                            if (!repo.refs.state) UI.toast(label + (params.push ? ': done and pushed' : ': done'));
                        } },
        stashDialog:    { title: 'Stash…', enabled: () => ready() && changes(App.repo) > 0, run: () => App.ui.openStash() },
        stash:          { run: params => App.git(App.repo, 'stash', params, 'Stash') },
        tagDialog:      { title: 'New tag…', enabled: () => ready() && !!App.repo.refs.head.hash, run: hash => App.ui.openTag(hash) },
        tag:            { run: params => App.git(App.repo, 'tag', params, 'Tag ' + params.name) },
        resetDialog:    { run: hash => App.ui.openReset(hash) },
        reset:          { run: params => App.git(App.repo, 'reset', params, `Reset (${params.mode})`) },
        checkout:       { run: name => App.checkout(App.repo, { ref: name }, name) },
        checkoutRemote: { run: name => App.ui.openCheckoutRemote(name) },
        checkoutTrack:  { run: params => App.checkout(App.repo, { ...params, mode: 'track' }, params.local) },
        checkoutDetached: { run: async ref => {
                            const name = /^[0-9a-f]{40}$/.test(ref) ? ref.slice(0, 8) : ref, note = 'HEAD becomes detached: new commits will not belong to any branch.';
                            // with local changes the local-changes question carries the warning, so there is one dialog
                            if (!changes(App.repo) && !await UI.confirm(`Check out ${name}? ${note}`, 'Checkout')) return;
                            return App.checkout(App.repo, { ref, mode: 'detach' }, name, note);

        deleteBranch:   { run: branch => App.ui.openDeleteBranch(branch) },
        renameDialog:   { run: target => App.ui.openRename(target) },
        renameBranch:   { run: ({ label, ...params }) => App.git(App.repo, 'rename_branch', params, label) },
        renameTagDialog: { run: name => App.ui.openRenameTag(name) },
        renameTag:      { run: ({ label, ...params }) => App.git(App.repo, 'rename_tag', params, label) },
        deleteBranchNow: { run: params => App.git(App.repo, 'delete_branch', params, 'Delete branch ' + params.name) },
        deleteTag:      { run: async name => {
                            if (!await UI.confirm(`Delete the local tag ${name}?`, 'Delete')) return;
                            return App.git(App.repo, 'delete_tag', { name }, 'Delete tag ' + name);
                        } },
        stashApply:     { run: stash => App.git(App.repo, 'stash_apply', { ref: stash.ref }, 'Apply ' + stash.ref) },
        stashPop:       { run: stash => App.git(App.repo, 'stash_pop', { ref: stash.ref }, 'Pop ' + stash.ref) },
        stashDrop:      { run: async stash => {
                            if (!await UI.confirm(`Delete ${stash.ref} "${stash.message}"? This cannot be undone.`, 'Delete')) return;
                            return App.git(App.repo, 'stash_drop', { ref: stash.ref }, 'Drop ' + stash.ref);
                        } },
        cherryPick:     { run: async commit => {
                            const short = commit.hash.slice(0, 8);
                            if (!await UI.confirm(`Apply the changes of ${short} "${commit.subject}" to the working copy? Nothing is committed: ` +
                                'review them in File status, then commit.', 'Cherry-pick')) return;
                            return App.prepare(App.repo, 'cherry_pick', { ref: commit.hash, mainline: commit.parents.length > 1 }, 'Cherry-pick ' + short);
                        } },
        revert:         { run: async commit => {
                            const short = commit.hash.slice(0, 8);
                            if (!await UI.confirm(`Undo the changes of ${short} "${commit.subject}" in the working copy? Nothing is committed: ` +
                                'review them in File status, then commit.', 'Revert')) return;
                            return App.prepare(App.repo, 'revert', { ref: commit.hash, mainline: commit.parents.length > 1 }, 'Revert ' + short);
                        } },
        undoCommit:     { title: 'Undo last commit (keep changes staged)…', enabled: () => ready() && !!App.repo.refs.head.hash, run: async () => {
                            const repo = App.repo, refs = repo.refs, branch = refs.branches.find(b => b.current);
                            const head = repo.log.commits.find(c => c.hash === refs.head.hash);
                            const pushed = branch?.upstream && !branch.ahead;
                            const message = `Undo the last commit ${refs.head.hash.slice(0, 8)}${head ? ` "${head.subject}"` : ''}? ` +
                                'Its changes stay staged (git reset --soft HEAD~1).' +
                                (pushed ? ` Warning: the commit is already on ${branch.upstream}; pushing again will need a force push.` : '');
                            if (!await UI.confirm(message, 'Undo commit')) return;
                            await App.git(repo, 'undo_commit', {}, 'Undo last commit');
                            await App.showView('status');
                        } },
        forcePushDialog: { title: 'Force push…', enabled: () => ready() && !!App.repo.refs.head.branch && App.repo.refs.remoteNames.length > 0,
                          run: () => App.ui.openForcePush() },
        forcePush:      { run: params => App.git(App.repo, 'force_push', params, 'Force push to ' + params.remote) },
        abort:          { title: 'Abort merge / rebase…', enabled: () => !!App.repo?.refs?.state, run: async () => {
                            const repo = App.repo, state = stateName(repo.refs.state);
                            if (!await UI.confirm(`Abort the ${state} in progress? Its changes are thrown away.`, 'Abort')) return;
                            try { await App.git(repo, 'abort', {}, 'Abort ' + state); } finally { App.rebaseDone(repo); }
                        } },

        // Rewriting history: combine / reword (new commits with the same final tree, the working copy is untouched),
        // interactive rebase (git rebase -i with the user's list), and undo of the last one.
        combineDialog:  { run: hashes => App.ui.openRewrite('combine', hashes) },
        rewordDialog:   { run: hash => App.ui.openRewrite('reword', [hash]) },
        rewrite:        { run: async params => {
                            const repo = App.repo, n = params.hashes.length;
                            const label = params.mode === 'combine' ? `Combine ${n} commits` : 'Reword ' + params.hashes[0].slice(0, 8);
                            const result = await App.git(repo, 'rewrite', params, label);
                            repo.undo = { label, ref: result.ref, old: result.old, new: result.new };
                            await App.selectCommit(repo, result.created);
                        } },
        rebaseDialog:   { run: hash => App.ui.openRebase(hash) },
        rebase:         { run: async params => {
                            const repo = App.repo, head = repo.refs.head;
                            repo.rebasing = { label: 'Interactive rebase', ref: head.branch ? 'refs/heads/' + head.branch : 'HEAD', old: head.hash };
                            repo.undo = null;
                            return App.rebaseStep(repo, 'rebase', params, 'Interactive rebase');
                        } },
        rebaseContinue: { title: 'Continue rebase', enabled: () => App.repo?.refs?.state === 'rebase', run: async () => {
                            return App.rebaseStep(App.repo, 'rebase_continue', {}, 'Continue rebase');
                        } },
        rebaseSkip:     { run: async () => {
                            const repo = App.repo;
                            if (!await UI.confirm('Skip the commit the rebase stopped on? Its changes are left out of the branch.', 'Skip commit')) return;
                            return App.rebaseStep(repo, 'rebase_skip', {}, 'Skip commit');
                        } },
        undoRewrite:    { title: 'Undo last combine / reword / rebase', enabled: () => !!App.undoShown(App.repo), run: async () => {
                            const repo = App.repo, { label, ref, old, new: now } = repo.undo;
                            await App.git(repo, 'rewrite_undo', { ref, old, new: now }, 'Undo ' + label.toLowerCase());
                            repo.undo = null;
                            await App.selectCommit(repo, repo.refs.head.hash);
                        } },
        dismissUndo:    { run: () => { App.repo.undo = null; } },
        reveal:         { title: REVEAL, enabled: hasRepo, run: () => App.git(App.repo, 'reveal', {}, 'Show folder') },
        revealFile:     { run: path => App.git(App.repo, 'reveal', { path }, 'Show ' + path) },      // selected, never opened
        chooseFolder:   { run: async () => {           // the OS folder dialog; the chosen repository opens, the window closes
                            const { path } = await Api.call('choose', { path: App.state.browser.path });
                            if (!path) return;
                            await App.commands.addRepo.run(path);
                            App.ui.openWindow.close();
                        } },
        terminal:       { title: 'Open in Terminal', enabled: hasRepo, run: () => App.git(App.repo, 'terminal', {}, 'Open terminal') },
        openWeb:        { items: () => App.repo?.refs ? App.webItems(App.repo, 'Open') : [] },     // one item per remote web page
        webDialog:      { title: 'Open remote in browser…', enabled: () => ready() && App.webPages(App.repo).length > 0, run: () => {
                            const pages = App.webPages(App.repo);
                            return pages.length === 1 ? App.commands.openUrl.run(pages[0].web) : App.ui.openWeb(pages);
                        } },
        openUrl:        { run: url => {
                            if (!/^https?:\/\//.test(url)) throw new UserError('Not a web link: ' + url);
                            window.open(url, '_blank', 'noopener');
                        } },
        copyRepoPath:   { title: 'Copy repository path', enabled: hasRepo, run: () => App.commands.copy.run(App.repo.path) },
        copy:           { run: async (text, label) => {      // label: the toast, for a long text (several paths)
                            try { await navigator.clipboard.writeText(text); } catch { throw new UserError('The clipboard is not available'); }
                            UI.toast(label || 'Copied: ' + text);
                        } },

        // View and settings
        ignoreWs:       { title: 'Ignore whitespace in diffs', checked: () => App.settings.ignoreWs, run: () => App.configureDiff({ ignoreWs: !App.settings.ignoreWs }) },
        wrapDiff:       setting('Wrap long lines', 'wrapDiff'),
        sidePanel:      setting('Sidebar', 'sidePanel'),
        statusBar:      setting('Status bar', 'statusBar'),
        themeDark:      setting('Dark theme', 'theme', 'dark'),
        themeLight:     setting('Light theme', 'theme', 'light'),
        themeAuto:      setting('System theme', 'theme', 'auto'),
        configure:      { run: patch => App.configureDiff(patch) },                       // the Settings form, layout sizes
        commandLog:     { title: 'Command log', run: () => { App.ui.logWindow.show(); } },
        settings:       { title: 'Settings…', key: 'mod+,', run: () => { App.ui.settingsWindow.show(); } },
        shortcuts:      { title: 'Keyboard shortcuts', key: 'f1', run: () => { App.ui.shortcutsWindow.show(); } },
        about:          { title: 'About…', run: () => { App.ui.aboutWindow.show(); } },
    },

    menus: {
        File: ['openRepo', '-', 'nextTab', 'prevTab', 'closeTab'],
        Repository: ['refresh', '-', 'commitView', 'pullDialog', 'pushDialog', 'forcePushDialog', 'fetchDialog', '-', 'branchDialog', 'mergeDialog', 'mergeToDialog', 'tagDialog', 'stashDialog',
            '-', 'stageAll', 'unstageAll', 'discardAll', 'undoCommit', 'undoRewrite', '-', 'rebaseContinue', 'abort', '-', 'reveal', 'terminal', 'openWeb'],
        View: ['viewStatus', 'viewHistory', 'viewSearch', '-', 'scopeAll', 'scopeCurrent', 'scopeFirst', 'showRemotes', '-', 'orderDate', 'orderTopo',
            '-', 'ignoreWs', 'wrapDiff', '-', 'sidePanel', 'statusBar', 'themeDark', 'themeLight', 'themeAuto', '-', 'commandLog', 'settings'],
        Help: ['shortcuts', '-', 'about'],
    },
    tabMenu: ['refresh', 'reveal', 'terminal', 'openWeb', 'copyRepoPath', '-', 'closeTab', 'closeOthers', '-', 'openRepo'],

    // ---------- Helpers shared by several commands ----------

    // Menu items that open the remotes' web pages (refs.webUrls): '<text> on GitHub', or '<text> on origin (GitHub)'
    // when there are several pages. target: see Git.webLink; remote: only that remote's pages. No page, no item.
    webItems(repo, text, target = null, remote = '') {
        const pages = this.webPages(repo);
        const several = !remote && pages.length > 1;
        return pages.filter(p => !remote || p.name === remote).map(p => {
            const link = Git.webLink(p.web, target), host = Git.hosting(p.web).name;
            return link && { title: `${text} on ${several ? `${p.name} (${host})` : host}`, run: () => App.run('openUrl', link) };
        }).filter(Boolean);
    },

    // Web pages of the remotes (refs.webUrls): [{ name: remote, web }], one per page.
    webPages(repo) {
        return Object.entries(repo.refs?.webUrls || {}).flatMap(([name, urls]) => urls.map(web => ({ name, web })));
    },

    newRepo(path, name) {
        const id = this.state.nextId++;
        return {
            id, path, name, color: this.colors[(id - 1) % this.colors.length],
            view: 'history', error: '', busy: '', tokens: {}, toggled: [], shownBranch: null, sideSel: '',
            undo: null, rebasing: null,       // { label, ref, old, new }: the last rewrite (Undo bar); a rebase in progress
            refs: null, status: null, labels: {}, files: { staged: [], unstaged: [] },
            log: { commits: [], list: [], rows: [], width: 1, more: false, loading: false, key: '' },
            search: { text: '', mode: 'message', commits: null, running: false },
            sel: { hash: '', info: null, file: null, diff: null },             // History / Search: the commit and its file
            wc: { file: null, diff: null, message: '', amend: false, push: false, mergeMessage: '' },  // File status; options never saved
        };
    },

    addTab(path, name) {
        let repo = this.state.repos.find(r => r.path === path);
        if (!repo) this.state.repos.push(repo = this.newRepo(path, name));
        return repo;
    },

    saveRepos() {
        this.configure({ repos: this.state.repos.map(r => r.path) });
    },

    async activate(repo) {
        this.state.activeId = repo.id;
        this.configure({ active: repo.path });
        try {
            await this.reload(repo);
        } catch (error) {
            if (error instanceof UserError && !repo.refs) repo.error = error.message;     // never loaded: show it in place of the views
            throw error;
        }
    },

    closeTab(id) {
        const { repos } = this.state, index = repos.findIndex(r => r.id === id);
        repos.splice(index, 1);
        this.saveRepos();
        if (this.state.activeId === id && repos.length) return this.activate(repos[Math.min(index, repos.length - 1)]);
        if (!repos.length) this.state.activeId = 0;
    },

    stepTab(dir) {
        const { repos } = this.state;
        return this.activate(repos[(repos.indexOf(this.repo) + dir + repos.length) % repos.length]);
    },

    // Server call for a repository. Resolves to null when a newer request of the same slot started meanwhile, so a slow
    // answer never overwrites a newer one (fast clicking through commits). Schedules a refresh for the data.
    async request(repo, slot, name, body = {}) {
        const token = repo.tokens[slot] = (repo.tokens[slot] || 0) + 1;
        try {
            const data = await Api.call(name, { repo: repo.path, ...body });
            if (repo.tokens[slot] !== token) return null;
            this.ui.invalidate();
            return data;
        } catch (error) {
            if (repo.tokens[slot] !== token) return null;
            throw error;
        }
    },

    // Runs a write action (ACTIONS in diffclew.py), logs it, reloads the repository. A failure opens a window with
    // git's output and ends the command with a UserError.
    async git(repo, action, params = {}, label = action) {
        repo.busy = label;
        this.ui.invalidate();
        let result;
        try {
            result = await Api.call('action', { repo: repo.path, action, ...params });
        } finally {
            repo.busy = '';
        }
        const { console } = this.state;
        console.unshift({ id: this.state.nextId++, time: Date.now(), repo: repo.name, label, ok: result.ok, output: result.output });
        console.splice(200);
        try {
            await this.reload(repo);
        } catch (error) {
            if (!(error instanceof UserError)) throw error;
        }
        if (!result.ok) {
            this.ui.showOutput(label + ' failed', result.output);
            throw new UserError(label + ' failed');
        }
        return result;
    },

    // Checkout (branch, tracking branch, detached). With uncommitted changes it first asks what to do with them:
    // stash them, discard them, or take them along (git refuses when they clash with the other branch); cancel stops.
    // A merge / rebase / cherry-pick / revert in progress is aborted first, after a confirmation: git refuses to switch
    // during it, and stashing its changes would drop the merge without a word.
    async checkout(repo, params, name, note = '') {
        await this.reload(repo);                  // the changes as they are now, not as the last refresh saw them
        const state = stateName(repo.refs?.state);
        if (state) {
            if (!await UI.confirm(`A ${state} is in progress. Abort it and switch to ${name}? Its changes are thrown away.`, 'Abort and switch')) return;
            await this.git(repo, 'abort', {}, 'Abort ' + state);
        }
        let localChanges = 'keep';
        if (changes(repo)) {
            localChanges = await this.ui.askLocalChanges(repo, name, note);
            if (!localChanges) return;
        }
        return this.git(repo, 'checkout', { ...params, localChanges }, 'Checkout ' + name);
    },

    // Merge, cherry-pick, revert: git only prepares the change (--no-commit); File status then shows it to review,
    // with the message in the commit box - also when git stopped on conflicts.
    async prepare(repo, action, params, label) {
        try {
            await this.git(repo, action, params, label);
        } finally {
            if (changes(repo) || repo.refs?.state) await this.showView('status');
        }
    },

    // Rebase, continue, skip: stopped on a conflict -> File status; ended -> History with the Undo bar.
    async rebaseStep(repo, action, params, label) {
        try {
            await this.git(repo, action, params, label);
        } finally {
            if (repo.refs?.state === 'rebase') await this.showView('status');
            else {
                this.rebaseDone(repo);
                await this.showView('history');
            }
        }
    },

    // An interactive rebase ended (finished, or aborted): the change it made becomes the one Undo puts back.
    // Still stopped on a conflict: nothing yet (continue / skip call this again).
    rebaseDone(repo) {
        const r = repo.rebasing;
        if (!r || repo.refs?.state === 'rebase') return;
        repo.rebasing = null;
        if (repo.refs && repo.refs.head.hash !== r.old) repo.undo = { ...r, new: repo.refs.head.hash };
    },

    // The undo offer of the last combine / reword / rebase, while its branch is still where that left it.
    undoShown(repo) {
        const u = repo?.undo, refs = repo?.refs;
        if (!u || !refs) return null;
        const tip = u.ref === 'HEAD' ? refs.head.hash : refs.branches.find(b => 'refs/heads/' + b.name === u.ref)?.hash;
        return tip === u.new ? u : null;
    },

    // Refs and working copy status; the log again when it shows something else now (force: always).
    async reload(repo, force = false) {
        const [refs, status] = await Promise.all([this.request(repo, 'refs', 'refs'), this.request(repo, 'status', 'status')]);
        if (!refs || !status) return;              // a newer reload is on its way
        Object.assign(repo, { refs, status, labels: Git.labels(refs), files: Git.wcFiles(status), error: '' });
        if (refs.head.branch !== repo.shownBranch) {    // a new current branch: open its folders once; the others stay as they are
            repo.shownBranch = refs.head.branch;
            repo.toggled = [...new Set([...repo.toggled, ...Git.folderIds(refs.head.branch, 'b:')])];
        }
        const wc = repo.wc;
        if (status.message !== wc.mergeMessage) {     // a merge stopped / ended: its message fills the box unless the user wrote one
            if (!wc.message.trim() || wc.message === wc.mergeMessage) wc.message = status.message;
            wc.mergeMessage = status.message;
        }
        if (force || Git.logKey(refs, this.settings) !== repo.log.key) await this.loadLog(repo);
        else this.rebuildGraph(repo);
        await this.refreshSelections(repo);
    },

    // First page of the log (as many commits as were loaded, up to 2000), or the next page (append).
    async loadLog(repo, append = false) {
        const log = repo.log, { scope, remotes, order } = this.settings;
        if (append && (!log.more || log.loading)) return;
        log.loading = true;
        try {
            const skip = append ? log.commits.length : 0, limit = append ? PAGE : clamp(log.commits.length, PAGE, 2000);
            const data = await this.request(repo, 'log', 'log', { skip, limit, scope, remotes, order });
            if (!data) return;
            if (append) {
                const seen = new Set(log.commits.map(c => c.hash));
                log.commits = log.commits.concat(data.commits.filter(c => !seen.has(c.hash)));
            } else {
                log.commits = data.commits;
            }
            log.more = data.more;
            log.key = Git.logKey(repo.refs, this.settings);
            this.rebuildGraph(repo);
            if (!repo.sel.hash && log.list.length) await this.selectCommit(repo, log.list[0].hash);
        } finally {
            log.loading = false;
        }
    },

    // The rows the history shows: "Uncommitted changes" on top when there are any or a merge waits, and the graph lanes.
    rebuildGraph(repo) {
        const log = repo.log, mergeHeads = repo.refs?.mergeHeads || [];
        log.list = changes(repo) || mergeHeads.length ? [Git.wcCommit(repo.refs?.head.hash, mergeHeads), ...log.commits] : log.commits;
        // first-parent history: merged branches are not in the list, so their lanes would never close - draw one line
        const firstParent = this.settings.scope === 'first';
        Object.assign(log, Git.graph(firstParent ? log.list.map(c => ({ hash: c.hash, parents: c.parents.slice(0, 1) })) : log.list));
    },

    setFilter(values) {
        this.configure(values);
        if (this.repo?.refs) return this.loadLog(this.repo);
    },

    // Settings that change the diffs load the open diffs again.
    configureDiff(patch) {
        const before = { context: this.settings.context, ignoreWs: this.settings.ignoreWs };
        this.configure(patch);
        const repo = this.repo;
        if (!repo || (before.context === this.settings.context && before.ignoreWs === this.settings.ignoreWs)) return;
        return Promise.all([
            repo.sel.file && this.selectFile(repo, repo.sel.file, true),
            repo.wc.file && this.selectWcFile(repo, repo.wc.file, true),
        ]);
    },

    async showView(view) {
        const repo = this.repo;
        repo.view = view;
        if (view === 'status' && !repo.wc.file) {
            const first = repo.files.unstaged[0] || repo.files.staged[0];
            if (first) await this.selectWcFile(repo, first);
        }
        if (view === 'search') this.ui.focusSearch();
    },

    wcInfo(repo) {
        return { hash: WC, parents: [], message: 'Uncommitted changes', files: [...repo.files.staged, ...repo.files.unstaged] };
    },

    async search(repo) {
        const search = repo.search;
        if (!search.text.trim()) throw new UserError('Type what to search for');
        search.running = true;
        try {
            const data = await this.request(repo, 'search', 'search', { text: search.text, mode: search.mode });
            if (data) search.commits = data.commits;
        } finally {
            search.running = false;
        }
    },

    // path: the file to show first (file history), else the commit's first file.
    async selectCommit(repo, hash, path = '') {
        const sel = repo.sel;
        const pickFile = files => (path && files.find(f => f.path === path || f.oldPath === path)) || files[0];
        if (sel.hash === hash && sel.info) {        // already shown: only switch to the asked file (file history)
            const file = path && pickFile(sel.info.files);
            if (file && sel.file?.id !== file.id) await this.selectFile(repo, file);
            return;
        }
        Object.assign(sel, { hash, info: null, file: null, diff: null });
        if (hash === WC) {
            sel.info = this.wcInfo(repo);
        } else {
            const info = await this.request(repo, 'info', 'commit', { hash });
            if (!info) return;
            info.files.forEach(f => Object.assign(f, { id: f.path, mode: 'commit' }));
            Object.assign(sel, { hash: info.hash, info });
        }
        const first = pickFile(sel.info.files);
        if (first) await this.selectFile(repo, first);
    },

    // reload: the same file again (its content changed); the old diff stays on screen meanwhile.
    async selectFile(repo, file, reload = false) {
        const sel = repo.sel;
        if (!reload && sel.file?.id === file.id && sel.diff) return;
        if (sel.file?.id !== file.id) sel.diff = { loading: true };
        sel.file = file;
        const diff = await this.loadDiff(repo, 'diff', file, sel.info);
        if (diff) sel.diff = diff;
    },

    async selectWcFile(repo, file, reload = false) {
        const wc = repo.wc;
        if (!reload && wc.file?.id === file.id && wc.diff) return;
        if (wc.file?.id !== file.id) wc.diff = { loading: true };
        wc.file = file;
        const diff = await this.loadDiff(repo, 'wcdiff', file);
        if (diff) wc.diff = diff;
    },

    async loadDiff(repo, slot, file, info) {
        const { context, ignoreWs } = this.settings;
        const body = { path: file.path, oldPath: file.oldPath, mode: file.mode, context, ignoreWs };
        if (file.mode === 'commit') Object.assign(body, { hash: info.hash, parent: info.parents[0] || '' });
        const data = await this.request(repo, slot, 'diff', body);
        return data && { files: Git.parseDiff(data.text), truncated: data.truncated };
    },

    // After a reload: the open working copy file follows its path (staging moves it to the other list), the
    // "Uncommitted changes" commit gets the new file list; both diffs load again.
    async refreshSelections(repo) {
        const { wc, sel, files } = repo, all = [...files.staged, ...files.unstaged];
        const find = file => all.find(f => f.id === file.id) || all.find(f => f.path === file.path);
        const jobs = [];
        if (wc.file) {
            const next = find(wc.file);
            if (next) jobs.push(this.selectWcFile(repo, next, true)); else Object.assign(wc, { file: null, diff: null });
        }
        if (sel.hash === WC) {
            if (!all.length) jobs.push(this.selectCommit(repo, repo.refs.head.hash || ''));
            else {
                sel.info = this.wcInfo(repo);
                const next = (sel.file && find(sel.file)) || all[0];
                jobs.push(this.selectFile(repo, next, true));
            }
        }
        await Promise.all(jobs);
    },

    // Selects a commit by "jump to" text or hash; loads more history until the commit is in it.
    async jump(repo, text) {
        const hash = Git.resolve(text, repo.log.commits, repo.refs);
        if (!hash) return;
        if (repo.view !== 'history') repo.view = 'history';
        const loaded = () => repo.log.commits.some(c => c.hash.startsWith(hash));
        while (!loaded() && repo.log.more && repo.log.commits.length < 20000) {
            const before = repo.log.commits.length;
            await this.loadLog(repo, true);
            if (repo.log.commits.length === before) break;
        }
        await this.selectCommit(repo, repo.log.commits.find(c => c.hash.startsWith(hash))?.hash || hash);
    },

    async browse(path) {
        const data = await Api.call('ls', { path });
        Object.assign(this.state.browser, { input: data.path, path: data.path, parent: data.parent, dirs: data.dirs });
    },

    // Push target of the current branch: its upstream, else the first remote under the same name.
    pushParams(repo) {
        const refs = repo.refs, branch = refs.branches.find(b => b.current);
        if (!branch || !refs.remoteNames.length) throw new UserError('Nothing to push to: no branch or no remote');
        const up = branch.upstream && Git.splitRemote(branch.upstream, refs.remoteNames);
        return { remote: up?.remote || refs.remoteNames[0], branch: branch.name, upstream: !branch.upstream };
    },

    // ---------- UI: init() builds it once, refresh() pushes the state into it ----------

            this.status = UI.createStatusBar([
                { id: 'branch' }, { id: 'sync' }, { id: 'changes', title: 'File status', onClick: () => App.run('showView', 'status') }, { id: 'busy' },

            ]);
            this.createWindows();
            this.viewTabs = UI.createViewTabs({ onSelect: id => App.run('showView', id) });     // History / File status / Search
            // after combine / reword / rebase: Undo while the branch is still where that left it (App.undoShown)
            this.undoBar = UI.createNode('div', { className: 'banner undo-bar' }, this.undoText = UI.createNode('span'),
                UI.createButton({ label: 'Undo', small: true, onClick: () => App.run('undoRewrite') }),
                UI.createButton({ label: '✕', small: true, title: 'Hide', onClick: () => App.run('dismissUndo') }));
            const content = UI.createNode('div', { className: 'content' }, this.viewTabs.node, this.undoBar, this.browserView, this.statusView, this.welcome);
            const main = UI.createNode('div', { className: 'main' }, this.side, content);
            document.body.append(this.menuBar.node, this.tabs.node, this.toolbar.node, main, this.status.node);

            document.addEventListener('keydown', e => {
                const id = App.keymap[UI.keyOf(e)];
                if (!id || document.querySelector('dialog:modal')) return;      // not a shortcut, or a modal window is open
                e.preventDefault();
                App.run(id);
            });
            window.addEventListener('focus', () => App.run('autoRefresh'));
            // Native menu (copy, paste, look up) only on text: fields, diffs, commit details, command outputs, dialog texts.
            UI.limitContextMenu('input, textarea, select, .diff-content, .diff-title, .cinfo, pre, .window-body p, .form-note, .welcome, .menubar-info');
