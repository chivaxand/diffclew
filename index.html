        },

        // CORE. Schedules one refresh for the next frame, however many commands run before it.
        invalidate() {
            this.frame ||= requestAnimationFrame(() => { this.frame = 0; this.refresh(); });
        },

        refresh() {
            const { settings, state } = App, repo = App.repo, refs = repo?.refs;
            const branch = refs?.branches.find(b => b.current);
            UI.setTheme(settings.theme);
            document.title = repo ? `${repo.name}${refs?.head.branch ? ' (' + refs.head.branch + ')' : ''} — DiffClew` : 'DiffClew';
            this.menuBar.setInfo(repo?.path || '');
            this.tabs.update(state.repos.map(r => ({ id: r.id, title: r.name, color: r.color })), state.activeId);
            this.toolbar.update(Object.fromEntries(this.toolItems.filter(t => t.id).map(t => [t.id, {
                disabled: App.commands[t.id].enabled?.() === false,
                badge: { commitView: repo && changes(repo), pullDialog: branch?.behind, pushDialog: branch?.ahead }[t.id],
            }])));

            const ok = !!repo && !repo.error && !!refs;
            this.side.setVisible(settings.sidePanel && !!repo);
            if (repo) this.refreshSide(repo);
            this.welcome.hidden = ok;
            this.viewTabs.node.hidden = !ok;
            const undo = ok && App.undoShown(repo);
            this.undoBar.hidden = !undo;
            if (undo) UI.setText(this.undoText, `${undo.label}: done on ${undo.ref === 'HEAD' ? 'HEAD' : undo.ref.slice(11)}. ` +
                'Undo puts the branch back where it was (the old commits are kept).');
            UI.setText(this.welcomeText, !repo ? 'Open a git repository to start: File → Open repository, or the + tab.'
                : repo.error ? `${repo.path}\n${repo.error}` : 'Loading…');
            this.browserView.hidden = !ok || repo.view === 'status';
            this.statusView.hidden = !ok || repo.view !== 'status';
            if (ok && repo.view === 'status') this.refreshStatusView(repo, settings);
            else if (ok) this.refreshBrowser(repo, settings);

            const head = refs?.head;
            this.status.setVisible(settings.statusBar);
            this.status.set({
                branch: !refs ? '' : head.branch ? '⎇ ' + head.branch : head.hash ? 'HEAD detached at ' + head.hash.slice(0, 8) : 'No commits yet',
                sync: branch ? Git.trackText(branch) || (branch.upstream ? '✓ ' + branch.upstream : 'no upstream') : '',
                changes: repo && changes(repo) ? `${changes(repo)} changed` : '',
                busy: repo?.busy ? `⟳ ${repo.busy}…` : repo?.search.running ? '⟳ Searching…' : repo?.log.loading ? '⟳ Loading…' : refs?.state ? '⚠ ' + stateName(refs.state).toUpperCase() + ' in progress' : '',
                commits: ok ? `${repo.log.commits.length}${repo.log.more ? '+' : ''} commits` : '',
                log: state.console.length ? `Log (${state.console.length})` : '',
            });

            this.settingsForm.setValue(settings);
            this.commandLog.update(state.console);
            this.openForm.setValue({ path: state.browser.input });
            this.dirList.update(state.browser.dirs.map(d => ({ ...d, id: d.path })));
        },

        refreshSide(repo) {
            const refs = repo.refs, toggled = repo.toggled, sel = repo.sideSel, count = changes(repo);
            this.viewTabs.update([
                { id: 'history', title: 'History' },
                { id: 'status', title: 'File status', count },
                { id: 'search', title: 'Search' },
            ], repo.view);
            const trees = [this.branchTree, this.tagTree, this.remoteTree, this.stashTree, this.submoduleTree];
            if (!refs) return trees.forEach(t => t.update([], ''));
            // Folders start closed; App.reload opens the current branch's folders when it changes (repo.toggled).
            this.branchTree.update(Git.tree(refs.branches, toggled, 'b:', false).map(row => !row.item ? row : {
                ...row, bold: row.item.current, color: row.item.current ? '#22c55e' : '', detail: Git.trackText(row.item),
                tooltip: row.item.name + (row.item.upstream ? ' → ' + row.item.upstream : ''),
            }), sel);
            this.tagTree.update(Git.tree(refs.tags, toggled, 't:', false), sel);
            this.remoteTree.update(Git.tree(refs.remotes, toggled, 'r:', false), sel);
            this.stashTree.update(refs.stashes.map(s => ({ id: 's:' + s.ref, title: s.message, item: s, tooltip: `${s.ref}: ${s.message}` })), sel);
            this.submodules.setVisible(refs.submodules.length > 0);
            this.submoduleTree.update(refs.submodules.map(m => ({ id: 'm:' + m.path, title: m.path, item: m })), sel);
        },

        refreshBrowser(repo, settings) {
            const search = repo.view === 'search', { sel } = repo;
            this.filterBar.hidden = search;
            this.searchBar.hidden = !search;
            Object.entries(this.filters).forEach(([name, control]) => control.setValue(settings[name]));
            this.searchText.setValue(repo.search.text);
            this.searchMode.setValue(repo.search.mode);
            const found = repo.search.commits?.length;
            UI.setText(this.searchInfo, !repo.search.commits ? '' : repo.search.mode === 'history'
                ? `${found} commit${found === 1 ? '' : 's'} changed this file` : `${found} commits found`);
            this.table.show(search
                ? { source: 'search', list: repo.search.commits || [], rows: null, labels: repo.labels, selected: sel.hash, more: false,
                    emptyText: repo.search.running ? 'Searching…' : repo.search.commits ? 'Nothing found' : 'Type a query and press Enter' }
                : { source: 'history', list: repo.log.list, rows: repo.log.rows, width: repo.log.width, labels: repo.labels, selected: sel.hash, more: repo.log.more,
                    emptyText: repo.log.loading ? 'Loading…' : 'No commits yet' });
            const files = sel.info?.files || [];
            UI.setText(this.filesCount, sel.info ? `${files.length}${sel.info.more ? '+' : ''} files` : '');
            const wc = sel.hash === WC;
            this.commitFiles.hidden = wc;
            this.historyWc.node.hidden = !wc;
            this.details.show(wc ? null : sel.info, repo.labels);      // first: its height sets the list's, which scrolling uses
            if (wc) this.historyWc.update(repo.files, sel.file?.id);
            else this.files.update(files, sel.file?.id);
            this.diff.show({ file: sel.file, diff: sel.diff, wrap: settings.wrapDiff, actions: wc ? this.hunkActions(sel.file, settings) : [],
                empty: sel.info && !files.length ? 'No file changes' : sel.hash ? '' : 'Select a commit' });
        },

        refreshStatusView(repo, settings) {
            const { wc, files, refs } = repo;
            this.banner.hidden = !refs.state;
            const conflicts = files.unstaged.some(f => f.conflict), rebase = refs.state === 'rebase';
            this.continueButton.node.hidden = this.skipButton.node.hidden = !rebase;
            UI.setText(this.bannerText, !refs.state ? '' : rebase ? (conflicts
                ? 'The rebase stopped on a conflict: resolve the files, stage them, then Continue. Skip leaves this commit out, Abort puts the branch back.'
                : 'The rebase is paused: stage the changes, then Continue (it commits them with the original message), or abort it.')
                : conflicts ? `A ${stateName(refs.state)} is in progress: resolve the conflicts, stage the files and commit, or abort it.`
                : `A ${stateName(refs.state)} is ready to commit: review the staged changes, then Commit, or abort it.`);
            this.wcLists.update(files, wc.file?.id);
            const file = wc.file, actions = this.hunkActions(file, settings);
            this.wcDiff.show({ file, diff: wc.diff, actions, wrap: settings.wrapDiff, empty: changes(repo) ? 'Select a file' : 'Nothing to commit, the working copy is clean' });
            let pushTarget = '';
            try { const p = App.pushParams(repo); pushTarget = `${p.remote}/${p.branch}`; } catch {}
            this.commitBox.show({ message: wc.message, amend: wc.amend, push: wc.push, pushTarget, staged: files.staged.length, busy: repo.busy });
        },

        // Left sidebar: the refs of the repository (the views are tabs above the content: viewTabs).
        createSide() {
            const menu = make => (row, x, y) => UI.showMenu(make(row.item), x, y);
            const toggle = row => App.run('toggleFolder', row.id);
            this.branchTree = UI.createTree({ emptyText: 'No branches', onToggle: toggle, onContext: menu(b => this.branchMenu(b)),
                onSelect: row => App.run('jumpToRef', row.item.hash, row.id), onOpen: row => App.run('checkout', row.item.name) });
            this.tagTree = UI.createTree({ emptyText: 'No tags', onToggle: toggle, onContext: menu(t => this.tagMenu(t)),
                onSelect: row => App.run('jumpToRef', row.item.hash, row.id), onOpen: row => App.run('checkoutDetached', row.item.name) });
            this.remoteTree = UI.createTree({ emptyText: 'No remotes', onToggle: toggle, onContext: menu(r => this.remoteMenu(r)),
                onSelect: row => App.run('jumpToRef', row.item.hash, row.id), onOpen: row => App.run('checkoutRemote', row.item.name) });
            this.stashTree = UI.createTree({ emptyText: 'No stashes', onContext: menu(s => this.stashMenu(s)),
                onSelect: row => App.run('selectStash', row.item, row.id), onOpen: row => App.run('stashApply', row.item) });
            this.submoduleTree = UI.createTree({ onSelect: () => {}, onOpen: row => App.run('addRepo', row.item.abs),
                onContext: menu(m => [{ title: 'Open as a tab', run: () => App.run('addRepo', m.abs) }, { title: 'Copy path', run: () => App.run('copy', m.path) }]) });
            const newBranch = UI.createButton({ label: '＋', kind: 'icon', title: 'New branch', onClick: () => App.run('branchDialog') });
            this.submodules = UI.createSection({ id: 'submodules', title: 'Submodules', content: this.submoduleTree });
            return UI.createSidePanel({
                edge: 'left',
                layout: App.settings.side,
                onLayout: side => App.run('configure', { side }),
                sections: [
                    UI.createSection({ id: 'branches', title: 'Branches', content: this.branchTree, actions: [newBranch] }),
                    UI.createSection({ id: 'tags', title: 'Tags', content: this.tagTree }),
                    UI.createSection({ id: 'remotes', title: 'Remotes', content: this.remoteTree }),
                    UI.createSection({ id: 'stashes', title: 'Stashes', content: this.stashTree }),
                    this.submodules,
                ],
            });
        },

        // History and Search: a bar, the commit table, below it the changed files + details | the diff.
        createBrowser() {
            const { settings } = App;
            this.filters = {
                scope: UI.createSelect({ options: [['all', 'All branches'], ['current', 'Current branch'], ['first', 'Current branch only']],
                    onChange: scope => App.run('setFilter', { scope }) }),
                remotes: UI.createCheckbox({ label: 'Show remote branches', onChange: remotes => App.run('setFilter', { remotes }) }),
                order: UI.createSelect({ options: [['date', 'Date order'], ['topo', 'Ancestor order']], onChange: order => App.run('setFilter', { order }) }),
            };
            const jump = UI.createTextInput({ placeholder: 'hash, branch or tag + Enter' });
            jump.input.addEventListener('keydown', e => { if (e.key === 'Enter') App.run('jumpTo', jump.getValue()); });
            this.filterBar = UI.createNode('div', { className: 'filterbar' }, Object.values(this.filters),
                UI.createNode('span', { className: 'spacer' }), UI.createNode('label', { htmlFor: jump.input.id = 'jump' }, 'Jump to:'), jump);

            this.searchText = UI.createTextInput({ placeholder: 'Search + Enter', onChange: text => App.run('setSearch', { text }) });
            this.searchText.input.addEventListener('keydown', e => { if (e.key === 'Enter') App.run('search'); });
            this.searchMode = UI.createSelect({ options: [['message', 'Commit messages'], ['author', 'Authors'], ['file', 'File paths'], ['history', 'File history (exact path)'], ['code', 'Changed code (slow)']],
                onChange: mode => App.run('setSearch', { mode }) });
            this.searchInfo = UI.createNode('span', { className: 'hint' });
            this.searchBar = UI.createNode('div', { className: 'filterbar' }, this.searchText, this.searchMode,
                UI.createButton({ label: 'Search', kind: 'primary', small: true, onClick: () => App.run('search') }),
                UI.createNode('span', { className: 'spacer' }), this.searchInfo);

            this.table = createCommitTable({
                onSelect: hash => App.run('selectCommit', hash),
                onOpen: commit => App.run('openCommit', commit),
                onContext: (commits, x, y) => UI.showMenu(this.commitMenu(commits), x, y),
                onMore: () => App.run('loadMore'),
            });
            const fileMenu = (files, x, y) => UI.showMenu(this.fileMenu(files), x, y);
            this.files = createFileList({ onSelect: f => App.run('selectFile', f), onContext: fileMenu, onMenu: fileMenu,
                onCopy: files => this.copyPaths(files) });
            this.filesCount = UI.createNode('span');
            this.details = createCommitDetails({ onParent: hash => App.run('jumpTo', hash) });
            this.diff = createDiffView({ onHunk: (action, fileIndex, hunkIndex) => App.run('hunk', action, fileIndex, hunkIndex, 'sel') });
            // a commit: its files and details; "Uncommitted changes": the staged / unstaged lists as in File status
            this.commitFiles = UI.createNode('div', { className: 'stack' },
                UI.createNode('div', { className: 'pane-head' }, UI.createNode('b', {}, 'Files'), UI.createNode('span', { className: 'spacer' }), this.filesCount),
                this.files);
            this.historyWc = this.createWcLists(f => App.run('selectFile', f), 'historyStagedHeight');
            const left = UI.createNode('div', { className: 'stack' }, this.commitFiles, this.historyWc.node, this.details);
            const bottom = UI.createSplit({ axis: 'x', first: left, second: this.diff, size: settings.filesWidth, min: 160,
                onResize: filesWidth => App.run('configure', { filesWidth }) });
            const split = UI.createSplit({ axis: 'y', first: this.table, second: bottom, fixed: 'second', size: settings.detailsHeight, min: 80,
                onResize: detailsHeight => App.run('configure', { detailsHeight }) });
            return UI.createNode('div', { className: 'view' }, this.filterBar, this.searchBar, split);
        },

        // Staged / Unstaged lists one above the other, with a draggable border (its height saved as settings[heightKey]).
        // Built twice: in File status and in History for the "Uncommitted changes" row. onSelect(file) shows a file.
        // Left checkbox = pick (like Ctrl/⌘ + click), header checkbox = pick all; + / − at the row's end and the header
        // buttons stage / unstage. Buttons for the picked files follow the picks (onPick), not the App state.
        createWcLists(onSelect, heightKey) {
            const menu = (files, x, y) => UI.showMenu(this.fileMenu(files), x, y), copy = files => this.copyPaths(files);
            const button = (label, run) => UI.createButton({ label, small: true, onClick: run });
            const w = {};
            w.staged = createFileList({ emptyText: 'Nothing staged', pickBoxes: true, action: { icon: '−', title: 'Unstage' },
                onContext: menu, onCopy: copy, onSelect, onMenu: menu,
                onAction: files => App.run('unstage', files), onOpen: f => App.run('unstage', [f]),
                onPick: files => w.unstagePicked?.setDisabled(!files.length) });
            w.unstaged = createFileList({ emptyText: 'No changes', pickBoxes: true, action: { icon: '+', title: 'Stage' },
                onContext: menu, onCopy: copy, onSelect, onMenu: menu,
                onAction: files => App.run('stage', files), onOpen: f => App.run('stage', [f]),
                onPick: files => {
                    w.stagePicked?.setDisabled(!files.length);
                    w.discardPicked?.setDisabled(!files.length || files.some(f => f.conflict));
                } });
            const head = (list, title, count, buttons) => UI.createNode('div', { className: 'pane-head' }, list.selectAllBox,
                UI.createNode('b', {}, title), count, UI.createNode('span', { className: 'spacer' }), buttons);
            const staged = UI.createNode('div', { className: 'stack' },
                head(w.staged, 'Staged files', w.stagedCount = UI.createNode('span'), [
                    w.unstagePicked = button('Unstage selected', () => App.run('unstage', w.staged.getPicked())),
                    w.unstageAll = button('Unstage all', () => App.run('unstageAll'))]),
                w.staged);
            const unstaged = UI.createNode('div', { className: 'stack' },
                head(w.unstaged, 'Unstaged files', w.unstagedCount = UI.createNode('span'), [
                    w.discardPicked = button('Discard…', () => App.run('discard', w.unstaged.getPicked())),
                    w.stagePicked = button('Stage selected', () => App.run('stage', w.unstaged.getPicked())),
                    w.stageAll = button('Stage all', () => App.run('stageAll'))]),
                w.unstaged);
            w.node = UI.createSplit({ axis: 'y', first: staged, second: unstaged, size: App.settings[heightKey], min: 60,
                onResize: size => App.run('configure', { [heightKey]: size }) }).node;
            w.update = (files, selectedId) => {
                w.staged.update(files.staged, selectedId);
                w.unstaged.update(files.unstaged, selectedId);
                UI.setText(w.stagedCount, String(files.staged.length));
                UI.setText(w.unstagedCount, String(files.unstaged.length));
                w.unstageAll.setDisabled(!files.staged.length);
                w.stageAll.setDisabled(!files.unstaged.length);
            };
            return w;
        },

        // Hunk buttons for a working copy file's diff (none for a commit's file, a conflict, or whitespace-blind diffs).
        hunkActions(file, settings) {
            if (!file || file.conflict || settings.ignoreWs) return [];
            if (file.mode === 'staged') return [{ id: 'unstage', label: 'Unstage hunk' }];
            if (file.mode === 'unstaged') return [{ id: 'discard', label: 'Discard hunk' }, { id: 'stage', label: 'Stage hunk', kind: 'primary' }];
            return [];
        },

        // File status: staged / unstaged lists | the diff with hunk buttons, the commit box below.

        // 'Open file on GitHub': a commit's file at that commit (a deleted one at the parent); a working copy file at the

        fileWebItems(file) {
            const repo = App.repo, refs = repo.refs;

        // Force push overwrites the remote branch: the button works only after the user types "force".
        openForcePush() {
            const refs = App.repo.refs, branch = refs.branches.find(b => b.current);
            const up = branch?.upstream && Git.splitRemote(branch.upstream, refs.remoteNames);
            const remote = up?.remote || (refs.remoteNames.includes('origin') ? 'origin' : refs.remoteNames[0]);
            const word = UI.createTextInput({ label: 'Type force', placeholder: 'force' });
            const form = UI.createForm({ fields: {
                remote: UI.createSelect({ label: 'Remote', options: refs.remoteNames, value: remote }),
                word,
            }, note: `git push <remote> HEAD --force-with-lease: replaces ${refs.head.branch} on the remote with your local branch. ` +
                'Commits that exist only on the remote are lost for everyone. --force-with-lease stops if the remote got commits ' +
                'you have not fetched. To confirm, type the word force.' });
            const win = UI.createWindow({ title: '⚠ Force push', content: form, buttons: [
                { label: 'Force push', primary: true, run: () => {

            const button = win.node.querySelector('.window-footer .primary');
            button.classList.replace('primary', 'danger');     // red, and Enter no longer presses it
            button.disabled = true;
            word.input.addEventListener('input', () => { button.disabled = word.getValue().trim() !== 'force'; });
            win.show();

        },

        openBranch(start) {
            const refs = App.repo.refs, at = start || App.repo.sel.info?.hash;
            const options = [['HEAD', `Working copy parent (${refs.head.branch || refs.head.hash.slice(0, 8)})`]];
            if (at && at !== WC) options.push([at, /^[0-9a-f]{40}$/.test(at) ? 'Commit ' + at.slice(0, 8) : at]);
            const form = UI.createForm({ fields: {
                name: UI.createTextInput({ label: 'New branch', placeholder: 'feature/name' }),
                start: UI.createSelect({ label: 'Start at', options, value: start ? start : 'HEAD' }),

                { label: 'Create branch', primary: true, run: () => App.run('branch', form.getValue()) },
                { label: 'Cancel' },
            ] }).show();
        },

        openMerge(ref) {
            const refs = App.repo.refs;
            const options = [...refs.branches.filter(b => !b.current).map(b => b.name), ...refs.remotes.map(r => r.name)];
            if (ref && !options.includes(ref)) options.unshift([ref, /^[0-9a-f]{40}$/.test(ref) ? 'Commit ' + ref.slice(0, 8) : ref]);
            if (!options.length) throw new UserError('There is nothing to merge');
            const ff = UI.createCheckbox({ label: 'Fast-forward when possible (no merge commit)' });
            const note = { node: UI.createNode('div', { className: 'form-note' }), label: '' };
            const update = ({ squash }) => {
                if (squash) ff.setValue(false);
                ff.setDisabled(squash);
                UI.setText(note.node, `Into ${refs.head.branch || 'detached HEAD'}. Nothing is committed yet: File status shows the result ` +
                    'to review (and conflicts to resolve), then ' + (squash
                    ? 'Commit makes one ordinary commit with all the changes, or Abort cancels it. The history keeps no link to ' +
                      'the merged branch: git does not see it as merged (delete it with "even if not merged"), and merging it again repeats its changes.'
                    : 'Commit creates the merge commit, or Abort cancels it.'));
            };
            const form = UI.createForm({ fields: {
                ref: UI.createSelect({ label: 'Merge', options, value: ref || [].concat(options[0])[0] }),
                ff,
                squash: UI.createCheckbox({ label: 'Squash: only the changes, as one ordinary commit (no merge in the history)' }),
                note,
            }, onChange: update });
            update(form.getValue());
            UI.createWindow({ title: 'Merge', content: form, buttons: [
                { label: 'Merge', primary: true, run: () => { App.run('merge', form.getValue()); } },
                { label: 'Cancel' },
            ] }).show();
        },

        // Merge the current branch into another local branch (action merge_to): the server switches to it, merges,
        // commits / pushes when asked and there are no conflicts, and switches back. Only on a clean working copy:
        // with uncommitted files nothing runs, the user decides what to do with them.
        async openMergeTo(target) {
            const repo = App.repo;
            await App.reload(repo);                  // the changes as they are now
            const refs = repo.refs, source = refs.head.branch;
            if (!source) throw new UserError('Check out the branch to merge first');
            if (refs.state) throw new UserError(`A ${stateName(refs.state)} is in progress: finish or abort it first`);
            if (changes(repo)) {
                const paths = [...new Set([...repo.files.staged, ...repo.files.unstaged].map(f => f.path))];
                const shown = paths.slice(0, 8).map(p => UI.createNode('div', {}, p));
                if (paths.length > shown.length) shown.push(UI.createNode('div', { className: 'hint' }, `and ${paths.length - shown.length} more`));
                UI.createWindow({ title: 'Uncommitted changes', content: [
                    UI.createNode('p', {}, `${paths.length} uncommitted file${paths.length > 1 ? 's' : ''} (staged, unstaged or new). ` +
                        `Merging into another branch needs a clean working copy: commit, stash or discard them first. Nothing was changed.`),
                    UI.createNode('pre', { className: 'output file-sample' }, shown),
                ], buttons: [
                    { label: 'Open File status', primary: true, run: () => { App.run('showView', 'status'); } },
                    { label: 'Close' },
                ] }).show();
                return;
            }
            const branches = refs.branches.filter(b => !b.current), names = branches.map(b => b.name);
            if (!names.length) throw new UserError('There is no other local branch to merge into');
            const pushable = b => !!b?.upstream && refs.remoteNames.some(r => b.upstream.startsWith(r + '/'));
            const push = UI.createCheckbox({ label: 'Push it to the upstream branch' });
            const note = { node: UI.createNode('div', { className: 'form-note' }), label: '' };
            const ff = UI.createCheckbox({ label: 'Fast-forward when possible (no merge commit)' });
            const update = ({ target, commit, squash }) => {
                const b = branches.find(x => x.name === target), canPush = commit && pushable(b);
                if (!canPush) push.setValue(false);
                push.setDisabled(!canPush);
                if (squash) ff.setValue(false);
                ff.setDisabled(squash);
                const merges = squash ? `squashes ${source} (its changes as one ordinary commit)` : `merges ${source}`;
                UI.setText(note.node, (commit
                    ? `Switches to ${target}, ${merges}, commits${canPush ? ' (and pushes)' : ''} and switches back to ${source}. ` +
                      `On conflicts it stays on ${target}: resolve them in File status, then commit and push yourself.`
                    : `Switches to ${target} and prepares the ${squash ? 'squash ' : ''}merge of ${source}: File status shows it to review and commit.`) +
                    (squash ? ` git does not see ${source} as merged afterwards.` : '') +
                    (b?.behind ? ` ${target} is ${b.behind} commit${b.behind > 1 ? 's' : ''} behind ${b.upstream}: pull it first, or the push is rejected.` : ''));
            };
            const form = UI.createForm({ fields: {
                target: UI.createSelect({ label: 'Into', options: names,
                    value: names.includes(target) ? target : ['develop', 'main', 'master'].find(n => names.includes(n)) || names[0] }),
                ff,
                squash: UI.createCheckbox({ label: 'Squash: only the changes, as one ordinary commit (no merge in the history)' }),
                commit: UI.createCheckbox({ label: 'Commit the merge when there are no conflicts', value: true }),
                push, note,
            }, onChange: update });
            update(form.getValue());
            UI.createWindow({ title: `Merge ${source} into…`, content: form, buttons: [
                { label: 'Merge', primary: true, run: () => { App.run('mergeTo', form.getValue()); } },
                { label: 'Cancel' },
            ] }).show();
        },

        // Combine several consecutive commits into one, or reword one (action rewrite). The plan names the branches whose
        // first-parent line holds the commits, and what else happens: newer commits made again, pushed commits, other refs.
        async openRewrite(mode, hashes) {
            const repo = App.repo, combine = mode === 'combine';
            const plan = await Api.call('rewrite_plan', { repo: repo.path, mode, hashes });
            const area = UI.createNode('textarea', { className: 'commit-msg rewrite-msg', spellcheck: false, value: plan.message });
            const branch = UI.createSelect({ label: 'Branch', options: plan.targets.map(t => [t.ref, t.name + (t.current ? ' (current)' : '')]) });
            const note = { node: UI.createNode('div', { className: 'form-note' }), label: '' };
            const update = ({ ref }) => {
                const t = plan.targets.find(x => x.ref === ref), n = t.after;
                UI.setText(note.node, (combine ? `${plan.count} commits become one: the content of the newest, the author and date of the oldest. ` : '') +
                    (n ? `${n} newer commit${n > 1 ? 's are' : ' is'} made again on top (same content, new hashes). ` : '') +
                    'Files and uncommitted changes are not touched; Undo is offered afterwards.' +
                    (t.pushed ? ` Warning: ${t.upstream} already has some of these commits: pushing will need a force push.` : '') +
                    (t.keep.length ? ` ${t.keep.join(', ')} keep${t.keep.length > 1 ? '' : 's'} pointing to the old commits.` : ''));
            };
            const form = UI.createForm({ fields: { ref: branch, message: UI.control(area, 'Message', area), note }, onChange: update });
            branch.setDisabled(plan.targets.length < 2);
            update(form.getValue());
            UI.createWindow({ title: combine ? `Combine ${plan.count} commits` : 'Reword commit ' + hashes[0].slice(0, 8), content: form, buttons: [
                { label: combine ? 'Combine' : 'Reword', primary: true, run: () => {
                    const { ref, message } = form.getValue();
                    if (!message.trim()) { UI.toast('Write a commit message first'); return false; }
                    App.run('rewrite', { mode, hashes, ref, message });
                } },
                { label: 'Cancel' },
            ] }).show();
            area.focus();
        },

        // Interactive rebase of the current branch from `start` up to HEAD (action rebase): the commits newest first as in
        // the history, an action per row (squash / fixup join the commit below), rows dragged by ⠿ to reorder, the message
        // of the selected row's group under the list. Conflicts stop it in File status: Continue / Skip / Abort.
        async openRebase(start) {
            const repo = App.repo;
            const plan = await Api.call('rebase_plan', { repo: repo.path, start });
            let rows = plan.commits.map(c => ({ ...c, action: 'pick', edited: null })).reverse(), selected = rows.length - 1;
            const original = rows.map(r => r.hash).join();
            const actions = [['pick', 'Pick'], ['squash', 'Squash ↓'], ['fixup', 'Fixup ↓'], ['drop', 'Drop']];
            const list = UI.createNode('div', { className: 'rebase-list' });
            const area = UI.createNode('textarea', { className: 'commit-msg rebase-msg', spellcheck: false, on: { input: () => {
                const head = Git.rebaseHeads(rows)[selected];
                if (head >= 0) rows[head].edited = area.value;
                update();
            } } });
            const areaLabel = UI.createNode('div', { className: 'hint rebase-label' });
            const note = UI.createNode('div', { className: 'form-note' });
            const autostash = UI.createCheckbox({ label: 'Stash the uncommitted changes during the rebase and bring them back after it (unstaged)', value: true });
            autostash.node.hidden = !plan.dirty;
            const pick = i => { selected = i; update(); };
            const makeRow = (r, i) => UI.createNode('div', { className: 'rebase-row', on: { mousedown: e => { if (!e.target.closest('select')) pick(i); } } },
                UI.createNode('span', { className: 'drag', title: 'Drag to move' }, '⠿'),
                UI.createSelect({ options: actions, value: r.action, onChange: action => { r.action = action; pick(i); } }).node,
                UI.createNode('span', { className: 'hash' }, r.hash.slice(0, 8)), UI.createNode('span', { className: 'subject' }),
                UI.createNode('span', { className: 'author' }, r.author));
            const invalid = heads => rows.some((r, i) => r.action !== 'drop' && heads[i] < 0);
            const update = () => {
                const heads = Git.rebaseHeads(rows);
                [...list.children].forEach((el, i) => {
                    const r = rows[i], message = r.action === 'pick' ? Git.rebaseMessage(rows, i, heads) : r.message;
                    el.className = `rebase-row ${r.action}${i === selected ? ' selected' : ''}${r.action !== 'drop' && heads[i] < 0 ? ' invalid' : ''}`;
                    el.title = message;
                    UI.setText(el.querySelector('.subject'), (r.action === 'squash' || r.action === 'fixup' ? '↳ ' : '') + message.split('\n')[0] +
                        (r.action === 'pick' && message.trim() !== r.message.trim() ? '  ✎' : ''));
                });
                const head = heads[selected], joined = rows.filter((r, i) => i !== head && heads[i] === head).length;
                const text = head >= 0 ? Git.rebaseMessage(rows, head, heads) : '';
                area.disabled = head < 0;
                if (area.value !== text) area.value = text;
                UI.setText(areaLabel, head >= 0 ? `Message of ${rows[head].hash.slice(0, 8)}` + (joined ? ` with ${joined} joined commit${joined > 1 ? 's' : ''}` : '') +
                    (rows[head].edited != null ? ' (edited)' : '') : rows[selected].action === 'drop' ? 'Dropped: its changes are left out' : 'Nothing below to join');
                const kept = rows.filter(r => r.action === 'pick').length, dropped = rows.filter(r => r.action === 'drop').length;
                UI.setText(note, invalid(heads) ? 'The oldest kept commit cannot be squashed or fixed up: there is nothing below it to join.'
                    : `${rows.length} commits → ${kept}${dropped ? ` (${dropped} dropped)` : ''}. Squash ↓ / Fixup ↓ join the commit below; Fixup drops its message. ` +
                      'Conflicts stop the rebase in File status: Continue, Skip or Abort.' +
                      (plan.pushed ? ` Warning: ${plan.upstream} already has some of these commits: pushing will need a force push.` : ''));
            };
            const render = () => { list.replaceChildren(...rows.map(makeRow)); update(); };
            UI.makeSortable(list, { item: '.rebase-row', handle: '.drag', axis: 'y', onMove: (from, to) => {
                const sel = rows[selected];
                rows = Git.move(rows, from, to);
                selected = rows.indexOf(sel);
                render();
            } });
            render();
            const win = UI.createWindow({ title: `Interactive rebase of ${plan.branch || 'HEAD'}`, content: [list, areaLabel, area, autostash, note], buttons: [
                { label: 'Start rebase', primary: true, run: () => {

                    if (invalid(Git.rebaseHeads(rows))) { UI.toast('The oldest kept commit cannot be squashed'); return false; }
                    if (!todo.some(t => t.action === 'pick')) { UI.toast('Every commit is dropped: use Reset instead'); return false; }
                    if (rows.map(r => r.hash).join() === original && todo.every(t => t.action === 'pick' && t.message === undefined)) {
                        UI.toast('Nothing to change');
                        return false;
                    }
                    App.run('rebase', { start, base: plan.base, todo, autostash: plan.dirty && autostash.getValue() });
                } },
                { label: 'Cancel' },
            ] });
            win.node.classList.add('wide');

// --- Test Runner (SHARED) ---
let testCaseNum = 0;

// Deep equality; numbers match within a relative 1e-9, so float results can be written as expected values directly.
function sameValue(a, b) {
    if (typeof a === 'number' && typeof b === 'number') {
        return a === b || Math.abs(a - b) <= 1e-9 * Math.max(Math.abs(a), Math.abs(b)) || (Number.isNaN(a) && Number.isNaN(b));
    }
    if (!a || !b || typeof a !== 'object' || typeof b !== 'object') return a === b;
    const keys = Object.keys(a);
    return Array.isArray(a) === Array.isArray(b) && keys.length === Object.keys(b).length && keys.every(k => sameValue(a[k], b[k]));
}

function testCase(name, actual, expected) {
    testCaseNum++;
    if (!sameValue(actual, expected)) throw new Error(`Test ${testCaseNum} FAIL (${name}): expected ${JSON.stringify(expected)}, but got ${JSON.stringify(actual)}`);
    console.log(`[Test ${testCaseNum}] PASS: ${name}`);
}

function runTests() {
    console.log('--- Starting tests ---');
    testCaseNum = 0;

    // Graph: M merges B and C, both forked from A.
    const g = Git.graph([{ hash: 'M', parents: ['B', 'C'] }, { hash: 'C', parents: ['A'] }, { hash: 'B', parents: ['A'] }, { hash: 'A', parents: [] }]);
    testCase('graph columns', g.rows.map(r => r.col), [0, 1, 0, 0]);
    testCase('graph width', g.width, 2);
    testCase('graph merge opens a lane', g.rows[0].lines, [[0, 0.5, 0, 1, 0], [0, 0.5, 1, 1, 1]]);
    testCase('graph lane passes by', g.rows[1].lines, [[0, 0, 0, 1, 0], [1, 0, 1, 0.5, 1], [1, 0.5, 1, 1, 1]]);
    testCase('graph lanes join at the fork', g.rows[3].lines, [[0, 0, 0, 0.5, 0], [1, 0, 0, 0.5, 1]]);
    testCase('graph second tip gets a new lane and colour',
        Git.graph([{ hash: 'a', parents: ['b'] }, { hash: 'c', parents: ['b'] }, { hash: 'b', parents: [] }]).rows.map(r => [r.col, r.color]), [[0, 0], [1, 1], [0, 0]]);
    testCase('graph uncommitted merge joins both heads',
        Git.graph([Git.wcCommit('h', ['m']), { hash: 'm', parents: ['b'] }, { hash: 'h', parents: ['b'] }, { hash: 'b', parents: [] }]).rows.map(r => r.col), [0, 1, 0, 0]);
    testCase('graph uncommitted lines are faint down to their parents',
        Git.graph([Git.wcCommit('h', ['m']), { hash: 'h', parents: ['b'] }, { hash: 'm', parents: ['b'] }, { hash: 'b', parents: [] }]).rows.slice(0, 3).map(r => r.lines),
        [[[0, 0.5, 0, 1, 0, true], [0, 0.5, 1, 1, 1, true]],
         [[0, 0, 0, 0.5, 0, true], [1, 0, 1, 1, 1, true], [0, 0.5, 0, 1, 0]],
         [[0, 0, 0, 1, 0], [1, 0, 1, 0.5, 1, true], [1, 0.5, 1, 1, 1]]]);
    testCase('web links', [
        Git.webLink('https://github.com/o/r', { branch: 'feature/x y' }),
        Git.webLink('https://gitlab.com/g/s/r', { commit: 'abc' }),
        Git.webLink('https://bitbucket.org/o/r', { commit: 'abc', path: 'a/b.txt' }),
        Git.webLink('https://dev.azure.com/o/p/_git/r', { branch: 'main', path: 'a b.txt' }),
        Git.webLink('https://git.example.com/o/r', { commit: 'abc' }),
        Git.webLink('https://git.example.com/o/r', null)],
        ['https://github.com/o/r/tree/feature/x%20y', 'https://gitlab.com/g/s/r/-/commit/abc', 'https://bitbucket.org/o/r/src/abc/a/b.txt',
         'https://dev.azure.com/o/p/_git/r?path=%2Fa%20b.txt&version=GBmain', '', 'https://git.example.com/o/r']);
    testCase('graph freed lane is reused',
        Git.graph([{ hash: 'a', parents: ['x'] }, { hash: 'b', parents: [] }, { hash: 'c', parents: ['y'] }]).rows.map(r => r.col), [0, 1, 1]);

    const diff = Git.parseDiff('diff --git a/x b/x\nindex 1..2 100644\n--- a/x\n+++ b/x\n@@ -1,3 +1,3 @@ fn\n a\n-b\n+B\n c\n');
    testCase('diff hunk', [diff.length, diff[0].hunks.length, diff[0].hunks[0].context], [1, 1, 'fn']);
    testCase('diff line numbers', diff[0].hunks[0].lines.map(l => [l.type, l.old, l.new]),
        [['ctx', 1, 1], ['del', 2, null], ['add', null, 2], ['ctx', 3, 3]]);
    testCase('hunk patch', Git.hunkPatch(diff[0], diff[0].hunks[0]),
        'diff --git a/x b/x\nindex 1..2 100644\n--- a/x\n+++ b/x\n@@ -1,3 +1,3 @@ fn\n a\n-b\n+B\n c\n');
    testCase('diff binary', Git.parseDiff('diff --git a/i.png b/i.png\nBinary files a/i.png and b/i.png differ\n')[0].binary, true);
    testCase('diff no newline', Git.parseDiff('@@ -1 +1 @@\n-a\n+b\n\\ No newline at end of file\n')[0].hunks[0].lines.map(l => l.type), ['del', 'add', 'meta']);

    const refs = { head: { branch: 'main', hash: 'h1', detached: false }, branches: [{ name: 'dev', hash: 'h1' }, { name: 'main', hash: 'h1', current: true }],
        remotes: [{ name: 'origin/main', hash: 'h1' }], tags: [{ name: 'v1', hash: 'h2' }] };
    testCase('labels: current branch first', Git.labels(refs).h1.map(l => l.name), ['main', 'dev', 'origin/main']);
    testCase('labels: tags', Git.labels(refs).h2, [{ type: 'tag', name: 'v1' }]);
    testCase('labels: behind upstream', Git.labels({ ...refs, branches: [{ name: 'dev', hash: 'h3', behind: 21 }] }).h3[0].track, '21 behind');
    testCase('resolve exact name', Git.resolve('v1', [], refs), 'h2');
    testCase('resolve hash prefix', Git.resolve('abcd', [{ hash: 'abcdef12' }], refs), 'abcdef12');
    testCase('resolve part of a name', Git.resolve('rigin', [], refs), 'h1');
    testCase('resolve unknown', Git.resolve('HEAD~2', [], refs), 'HEAD~2');

    const names = ['master', 'feature/b', 'develop', 'feature/a'].map(name => ({ name }));
    testCase('tree', Git.tree(names, [], 'b:').map(r => [r.id, r.depth]),
        [['b:develop', 0], ['b:feature/', 0], ['b:feature/a', 1], ['b:feature/b', 1], ['b:master', 0]]);
    testCase('tree closed folder', Git.tree(names, ['b:feature/'], 'b:').map(r => r.title), ['develop', 'feature', 'master']);
    testCase('folder ids', Git.folderIds('feature/ui/x', 'b:'), ['b:feature/', 'b:feature/ui/']);
    testCase('folder ids of a top-level name', Git.folderIds('develop', 'b:'), []);
    testCase('tree closed by default', Git.tree([{ name: 'origin/x' }], [], 'r:', false).map(r => [r.title, r.open]), [['origin', false]]);

    testCase('split remote', Git.splitRemote('origin/feature/x', ['up', 'origin']), { remote: 'origin', branch: 'feature/x' });
    testCase('track text', Git.trackText({ ahead: 2, behind: 21 }), '2↑ 21↓');
    testCase('format date', Git.formatDate(new Date(2026, 10, 12, 11, 32).getTime() / 1000), '12 Nov 2026 11:32');
    testCase('initials', Git.initials('Ulian  Smith Jr'), 'US');
    testCase('working copy ids', Git.wcFiles({ staged: [{ path: 'a', status: 'M' }], unstaged: [{ path: 'b', status: '?' }] }),
        { staged: [{ path: 'a', status: 'M', id: 's:a', mode: 'staged' }], unstaged: [{ path: 'b', status: '?', id: 'u:b', mode: 'untracked' }] });
    testCase('move', Git.move(['a', 'b', 'c'], 0, 2), ['b', 'c', 'a']);
    const ids = ['a', 'b', 'c', 'd', 'e'];
    testCase('pick one', Git.pick(ids, ['a', 'b'], 'a', 'c', 'one'), { picked: ['c'], anchor: 'c' });
    testCase('pick toggle on', Git.pick(ids, ['d'], 'd', 'b', 'toggle'), { picked: ['b', 'd'], anchor: 'b' });
    testCase('pick toggle off', Git.pick(ids, ['b', 'd'], 'b', 'd', 'toggle'), { picked: ['b'], anchor: 'd' });
    testCase('pick range up keeps the anchor', Git.pick(ids, ['d'], 'd', 'b', 'range'), { picked: ['b', 'c', 'd'], anchor: 'd' });
    testCase('pick range replaces', Git.pick(ids, ['a', 'e'], 'b', 'c', 'range'), { picked: ['b', 'c'], anchor: 'b' });
    testCase('pick add-range', Git.pick(ids, ['a'], 'c', 'e', 'add-range'), { picked: ['a', 'c', 'd', 'e'], anchor: 'c' });

    const rb = (action, hash, message = hash) => ({ hash, action, message, edited: null });
    const rows = [rb('fixup', 'e'), rb('squash', 'd'), rb('drop', 'c'), rb('pick', 'b'), rb('squash', 'a')];
    testCase('rebase heads skip drops', Git.rebaseHeads(rows), [3, 3, -1, 3, -1]);
    testCase('rebase squash message oldest first, fixup dropped', Git.rebaseMessage(rows, 3), 'b\n\nd');
    testCase('rebase todo oldest first', Git.rebaseTodo(rows.slice(0, 4)),
        [{ hash: 'b', action: 'pick', message: 'b\n\nd' }, { hash: 'c', action: 'drop' }, { hash: 'd', action: 'squash' }, { hash: 'e', action: 'fixup' }]);
    testCase('rebase todo: unchanged pick has no message', Git.rebaseTodo([rb('pick', 'b'), { ...rb('pick', 'a'), edited: 'A' }]),
        [{ hash: 'a', action: 'pick', message: 'A' }, { hash: 'b', action: 'pick' }]);

    console.log(`--- All ${testCaseNum} tests passed successfully! ---`);
}

// --- Initial Load ---
window.addEventListener('load', () => {
    runTests();       // Autorun tests on startup
    App.init();
});
</script>
